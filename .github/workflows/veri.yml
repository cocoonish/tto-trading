# GEÇİCİ — YALNIZ BU DALDA. main'deki veri.yml'e DOKUNULMADI.
# TCMB APİ analizi güncellemesi için EVDS keşif çekimi (analitik bilanço
# günlük serileri + vaziyet). İş bitince dosya main sürümüne geri döner.
name: Veri tazeleme

on:
  workflow_dispatch:
    inputs:
      zorla:
        description: 'Kullanılmıyor (main ile arayüz uyumu)'
        type: boolean
        default: false
      hatlar:
        description: 'Kullanılmıyor (main ile arayüz uyumu)'
        type: string
        default: ''

concurrency:
  group: veri
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tazele:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: APİ portföyü keşfi
        run: python "Research/analiz-tcmb-api/kesif_evds.py"
      - name: Commit (bu dala)
        run: |
          git config --global user.name  "tto-veri"
          git config --global user.email "bot@users.noreply.github.com"
          git add Research/analiz-tcmb-api || true
          if git diff --cached --quiet; then
            echo "veri değişmedi — commit yok"
          else
            git commit -m "araştırma: TCMB APİ — EVDS keşif tazelemesi (30.08)"
            git pull --rebase --autostash
            git push
          fi
