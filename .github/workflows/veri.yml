# GEÇİCİ — YALNIZ BU DALDA. main'deki veri.yml'e DOKUNULMADI.
#
# TCMB APİ portföyü analizinin genişletilmesi için analitik bilanço (günlük)
# ve haftalık vaziyet serileri EVDS'ten çekiliyor. Bu ortamın ağ vekili
# tcmb.gov.tr'yi engellediği için çekim, EVDS anahtarının zaten durduğu bu
# koşucudan yapılıyor; sonuç Research/analiz-tcmb-api/data/ altına bu dala
# commit ediliyor. İş bitince bu dosya main'deki sürümüne geri döndürülecek.
name: Veri tazeleme

on:
  workflow_dispatch:
    inputs:
      zorla:
        description: 'Kullanılmıyor (main ile arayüz uyumu için duruyor)'
        type: boolean
        default: false
      hatlar:
        description: 'Kullanılmıyor (main ile arayüz uyumu için duruyor)'
        type: string
        default: ''

concurrency:
  group: veri
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tazele:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: EVDS anahtarı
        run: |
          if [ -z "${TTO_EVDS_KEY}" ]; then
            echo "::error::TTO_EVDS_KEY tanımlı değil."
            exit 1
          fi

      - name: APİ portföyü keşfi (analitik bilanço + vaziyet)
        run: python "Research/analiz-tcmb-api/kesif_evds.py"

      - name: Commit (bu dala)
        run: |
          git config --global user.name  "tto-veri"
          git config --global user.email "bot@users.noreply.github.com"
          git add Research/analiz-tcmb-api || true
          if git diff --cached --quiet; then
            echo "veri değişmedi — commit yok"
          else
            git commit -m "araştırma: TCMB APİ — analitik bilanço günlük serileri (EVDS keşfi)"
            git pull --rebase --autostash
            git push
          fi
