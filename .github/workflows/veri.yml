# Veri tazeleme — resmî yayım takvimine göre, bültenden BAĞIMSIZ.
#
# Neden ayrı bir iş: bülten eskiden her koştuğunda on bir hattı baştan çekiyordu.
# 2026-08-25 koşusunda bu 37 dakika sürdü ve koşan yedi hattın YEDİSİ de "veri
# tarihi değişmedi" dedi — çekilecek yeni veri yoktu. Artık tazeleme kararını
# TÜİK'in Ulusal Veri Yayımlama Takvimi veriyor: bir hat, ancak beslendiği seri
# son tazelemeden sonra yayımlandıysa koşar (bkz. bulten/tazeleme.py).
#
# Koşu saatleri, yayım saatlerinin hemen ardına konumlandırıldı:
#   05:13 TR — gece boyunca kaçan bir şey varsa sabah bülteninden ÖNCE yakala.
#              Saat 06:07'den öne çekildi: bülten ölçümü 06:23'te koşuyor ve
#              aradaki 16 dakika bu işin bitmesine YETMİYORDU (37 dakikalık koşu
#              görüldü). Ölçüm, tazeleme daha koşarken depoya bakıyor ve dünün
#              verisiyle bülten kuruyordu — sessiz, çünkü iki iş de yeşil bitiyor.
#              70 dakikalık pay, iş bütçesinin (65 dk) tamamını kapsıyor.
# Dakikalar bilinçli olarak yuvarlak DEĞİL: GitHub'ın zamanlayıcısı saat başı
# ve yarımlarda sıkışıyor ve bu depoda 30 dk ile 2 saat arası gecikmeler görüldü.
#   11:47 TR — TÜİK 10:00 bültenleri (TÜFE, Yİ-ÜFE, hizmet ÜFE) API'ye düştü
#   15:23 TR — TCMB 14:30 (analitik bilanço). Bilanço 14:30'da yayımlanıyor ve
#              takvimdeki gecikme payı (gecikme_dk 45) ile ~15:15'te "hazır"
#              sayılıyor; 16:17'yi beklemek her gün ~1 saat kaybettiriyordu.
#   16:17 TR — TCMB 15:30 (kurlar) + 15:23 koşusu düşerse bilanço için ikinci şans
#   18:37 TR — HMB 17:30 (bütçe, borç stoku) + Hazine ihale sonuçları

name: Veri tazeleme

on:
  schedule:
    - cron: '13 2 * * 1-5'    # 05:13 İstanbul — bülten ölçümünden 70 dk önce
    # YEDEK TETİKLEYİCİ. Yukarıdaki koşu 26.08'de de 27.08'de de HİÇ
    # başlamadı — GitHub'ın zamanlayıcısı en iyi çaba esaslı ve bu depoda
    # sabah penceresi sistematik olarak düşüyor. Her tetikleyici bağımsız
    # bir şans; ikincisi ölçümden (03:23) hâlâ 42 dakika önce. Koşulacak
    # bir hat yoksa iş 40 saniyede biter, maliyeti yok.
    - cron: '41 2 * * 1-5'    # 05:41 İstanbul — sabah koşusu düşerse ikinci şans
    - cron: '47 8 * * 1-5'    # 11:47 İstanbul
    - cron: '23 12 * * 1-5'   # 15:23 İstanbul — analitik bilanço hazır olur olmaz
    - cron: '17 13 * * 1-5'   # 16:17 İstanbul
    - cron: '37 15 * * 1-5'   # 18:37 İstanbul
    # PAZAR. Bu satır 30.08.2026'ya kadar YOKTU ve haftalık zincirin ilk halkası
    # bütün hafta sonu boyunca hiç koşmuyordu: o gün haftaya bakış ölçümü
    # kurulduğunda son veri koşusunun üzerinden 38,7 saat geçmişti. Hafta içi
    # zincirin altı şansı varken haftalık zincirin sıfır şansı olması, haftalık
    # bülteni sistematik olarak bayat veriyle üretme riski demekti.
    - cron: '19 13 * * 0'     # 16:19 İstanbul — pazar ölçümünden 44 dk önce
  workflow_dispatch:
    inputs:
      zorla:
        description: 'Takvimi dinleme, seçilen hatları koşulsuz tazele'
        type: boolean
        default: false
      hatlar:
        description: 'Hangi hatlar (boş = takvimdeki hepsi). Bir üst hat yazılınca türevleri (carry, tufex, makro, reelfx) de koşar.'
        type: string
        default: ''
      # TAM KİP. Hafif kip mevcut veriden çıktı üretir; TAM kip kaynağa gidip
      # yeniden kazır. Hazine hattı için ayrım kritik: yeni İç Borçlanma
      # Stratejisi ancak tam kipte iniyor. Takvim tetiği (bkz. bulten/tazeleme.py
      # strateji tetiği) bunu ayın son iş günü kendiliğinden yapar; bu girdi,
      # yayım kaydığında ya da elle bir tazeleme gerektiğinde açık kapıdır.
      tam:
        description: 'Seçilen hatları TAM kipte koş (kaynağa git, yeniden kaz)'
        type: boolean
        default: false
      # KEŞİF KİPİ. Yeni bir seri/kaynak kurulmadan önce YOKLANMASI gerekiyor
      # (CLAUDE.md — dış kaynak önce yoklanır) ve o yoklama EVDS anahtarını
      # isteyen, ağa çıkan bir koşu. Şimdiye kadar bu, veri.yml'i bir dalda
      # geçici olarak "keşif kipine almak"la yapıldı: iş akışı dosyası
      # düzenlenip geri alınıyordu. Elle yapılan her adım bir gün atlanır ve
      # geri alma unutulursa main'deki tazeleme kipi bozulur. Keşif artık
      # birinci sınıf bir girdi: dosyaya dokunulmaz, koşu depoya YAZMAZ,
      # çıktı log'da kalır.
      kesif:
        description: 'Keşif betiği koş (ör. Aktarılacak Projeler/Enflasyon/kesif_ito.py) — depoya yazmaz'
        type: string
        default: ''

permissions:
  contents: write

# Aynı anda iki tazeleme koşusu commit yarışına girmesin.
concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  # KEŞİF — ayrı iş, çünkü tazelemenin hiçbir adımını (önbellek geri alma,
  # commit, tazeleme damgası) koşturmamalı. Depoya YAZMAZ: `contents: read`.
  kesif:
    if: inputs.kesif != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
      PYTHONPATH: ${{ github.workspace }}/ortak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Temel bağımlılıklar
        run: pip install --quiet requests pandas numpy
      # YOL KAPISI: yalnız depodaki bir kesif*.py koşabilir. Girdi serbest metin
      # olduğu için ne koşacağı ölçülmeden kabul edilmez.
      - name: Keşif betiğini koş
        run: |
          BETIK="${{ inputs.kesif }}"
          case "$(basename "$BETIK")" in
            kesif*.py) ;;
            *) echo "::error::Yalnız kesif*.py koşulabilir: $BETIK"; exit 1;;
          esac
          if [ ! -f "$BETIK" ]; then
            echo "::error::Betik yok: $BETIK"; exit 1
          fi
          # -u: tamponsuz çıktı. İlk keşif koşusu 20 dakikada tek satır
          # yazmadan iptal edildi — Python stdout'u tampona alıyordu ve
          # iptalle birlikte tampon da gitti. İlerlemenin görünmesi,
          # takıldığı adımı yeni bir koşu açmadan bulabilmek demek.
          cd "$(dirname "$BETIK")" && python3 -u "$(basename "$BETIK")"

  tazele:
    # Zamanlanmış koşuda `inputs` bağlamı boştur; `!inputs.kesif` orada da
    # doğru okur (boş dizge ve null'ün ikisi de "keşif yok" demektir).
    if: ${{ !inputs.kesif }}
    runs-on: ubuntu-latest
    # İŞ BÜTÇESİ — ADIM SINIRLARININ TOPLAMININ ÜSTÜNDE DURMAK ZORUNDA.
    #
    # 04.09.2026'da tam olarak bu tutmadı ve 45 dakikalık tazeleme çöpe gitti:
    # kurulum 5 (ölçüldü: iş 04:17'de tetiklendi, tazele adımı 04:22'de başladı)
    # + tazele 45 + türev 5 = 55 > 50, üstelik Hazine adımının HİÇ sınırı yoktu.
    # 04:22–05:07 tazeleme kendi sınırını doldurdu, 05:07'de Hazine başladı,
    # 05:12'de İŞ sınırı doldu ve `if: always()` taşıyan Koşu nabzı ile Commit
    # adımlarının İKİSİ DE pending kaldı. `if: always()` sigortası ADIM zaman
    # aşımına karşı çalışıyor, İŞ zaman aşımına karşı ÇALIŞMIYOR: iş sınırı
    # dolduğunda GitHub always() adımlarını da öldürüyor. Sonuç: 50 dakika
    # yandı, tazeleme damgası hiç ilerlemedi, bir sonraki koşu aynı 50 dakikayı
    # baştan yakacaktı.
    #
    # Yeni aritmetik (bulten/duman.py `_is_akisi_butcesi` bunu ENGEL olarak sınar):
    #   kurulum 5 + tazele 40 + türev 5 + hazine 8 + nabız/commit 2 = 60 ≤ 65
    # İş sınırını yalnız büyütmek yanışı uzatırdı; asıl düzeltme İŞİ (tazeleme)
    # kesip DEFTER TUTMAYA (damga + commit) yer bırakmaktır.
    #
    # 07.09.2026'DA YENİDEN KURULDU. Hazine adımının 8 dakikası hattın ölçülmüş
    # süresinin (bulutta 10–20 dk soğuk tarama) ALTINDAYDI ve kendini
    # kilitliyordu: kesilen koşu süre defterine yazmadığı için tavan hiç ölçüye
    # bağlanamıyordu. Adım 22'ye çıkınca aritmetik:
    #   kurulum 5 + tazele 40 + türev 5 + hazine 22 + nabız 1 + commit 1 = 74 ≤ 80
    # İş sınırı bir MALİYET DEĞİL TAVAN: Hazine adımı yalnız ihale günlerinde
    # kazıyor, öbür günlerde saniyelerde "ihale yok" deyip çıkıyor.
    timeout-minutes: 80
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
      # ortak/sitecustomize.py: zaman aşımısız kalan her HTTP isteğine varsayılan
      # zaman aşımı + yeniden deneme takar. Python onu PYTHONPATH'te bulunca
      # açılışta kendiliğinden import eder; hatların dosyalarına dokunmak gerekmez.
      # 2026-08-27: tcmb istemcisi isteği timeout'suz atıyor (kwargs sorgu dizesine
      # gidiyor, requests'e değil) ve EVDS hattı 21 dakika asılı kaldı.
      PYTHONPATH: ${{ github.workspace }}/ortak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Hatların ham veri önbellekleri (EVDS yanıtları, işlenmiş CSV'ler) depoya
      # girmiyor. Önbelleksiz koşucuda her hat her şeyi baştan indiriyor: kredi
      # 869 sn, DİBS 729 sn. Koşular arasında taşınınca artımlı çalışırlar.
      - name: Veri önbelleği
        uses: actions/cache@v4
        with:
          path: |
            Aktarılacak Projeler/*/data
            Research/marj/data
          key: veri-${{ github.run_id }}
          restore-keys: veri-

      # ÖNBELLEK DEPOYU EZMEZ.
      #
      # Yukarıdaki önbellek İZLENMEYEN ham veri için var (EVDS yanıtları,
      # işlenmiş CSV'ler). Ama `Aktarılacak Projeler/*/data` altında İZLENEN
      # dosyalar da duruyor — indices/data/index_history.json,
      # sentiment_scores.json, optimized_params.json. `restore-keys: veri-`
      # önek eşleşmesiyle EN SON veri koşusunun önbelleğini getiriyor; o
      # önbellek başka bir iş akışının (fx) ürettiği dosyaları görmediği için
      # onların ESKİ hâlini checkout'un üzerine yazıyordu.
      #
      # 27.08 04:18 koşusunda tam olarak bu oldu: 26.08 Pazar tam kipinin
      # 1 saat 45 dakikada ürettiği FX snapshot'ı önbellek tarafından geri
      # alındı, aşağıdaki `git add "Aktarılacak Projeler"` silmeyi sahiplendi
      # ve commit etti — hattın tarihçesi 7 kayıttan 6'ya düştü, üstelik
      # sessizce (koşu yeşil bitti).
      #
      # Kural: İZLENEN bir dosyanın doğru sürümü DEPODAKİdir. Önbellek yalnız
      # izlenmeyeni taşır. `git checkout --` izlenmeyen önbellek dosyalarına
      # dokunmaz, yalnız ezilen izlenenleri geri alır.
      - name: Önbellek depoyu ezmesin
        run: |
          ezilen=$(git diff --name-only -- "Aktarılacak Projeler" Research)
          if [ -n "$ezilen" ]; then
            echo "::warning::Önbellek izlenen dosyaları geri aldı; depo sürümüne dönülüyor:"
            echo "$ezilen"
            git checkout -- "Aktarılacak Projeler" Research
          else
            echo "önbellek izlenen dosyaya dokunmadı"
          fi

      - name: Temel bağımlılıklar
        # plotly: Carry/Tufex/Makroihtiyati/ReelSektorFX hatlarının grafikleri
        run: pip install --quiet requests pandas numpy plotly openpyxl
        # openpyxl: El Niño hattının küresel kanadı Dünya Bankası Pink
        # Sheet'ini (xlsx) okuyor; onsuz kanat sessizce düşerdi.

      # DUMAN SINAMASI: ağa çıkmadan, saniyeler içinde. Bu depoyu birden çok
      # oturum aynı gün düzenliyor; aralarındaki sözleşme kayması kimsenin
      # sınamadığı yerden vuruyor (26.08: _yayimlar tek listeden çifte döndü,
      # aynı gün eklenen başka bir çağrı onu tek liste sandı, veri hattı düştü).
      # Bu adım TANI DEĞİL: üretim kod yollarını sınar, düşerse koşu durmalı.
      - name: Duman sınaması (bülten katmanları)
        run: python bulten/duman.py

      - name: EVDS anahtarı
        run: |
          if [ -z "${TTO_EVDS_KEY}" ]; then
            echo "::error::TTO_EVDS_KEY tanımlı değil — EVDS'e giden hatlar tazelenemez."
            exit 1
          fi

      # Takvimin kararını önce RAPORLA: log'a bakan biri hangi hattın neden
      # koştuğunu/atlandığını, hangi yayımın tetiklediğini görsün.
      # TANI adımı: hangi hattın neden koşacağını LOGA yazar, karar vermez.
      # Kararı bir sonraki adım kendi içinde `--gerekli` ile yeniden alır.
      # 26.08 koşusunda bu adım bir hatayla düştü ve `bash -e` yüzünden tazeleme
      # ile Hazine adımları ATLANDI: dört hattın verisi hazırken hiçbiri
      # çekilmedi. Bir raporun üretimi durdurma yetkisi olamaz.
      # SINIR ÖLÇÜLDÜ. Bu adım 07.09 19:21 koşusunda 5 SANİYE sürdü; 08.09 04:17
      # koşusunda 4 dakikayı geçmişti ve hâlâ bitmemişti — kırk kat. Aynı sabah
      # denetim sebebi bağımsız olarak doğruladı: "yayım takvimi okunamadı, 18
      # hattın tamamı kör koşu listesinde", yani TÜİK ucu gerçekten cevap
      # vermiyordu. Adımın hiç zaman aşımı yok; `takvim._getir` isteği
      # `timeout=25` ile atıyor ama requests'in zaman aşımı TOPLAM süreyi değil
      # SOKET işlemini sınırlar — bayt bayt damlayan bir yanıtta okuma zaman
      # aşımı her parçada sıfırlanır ve istek süresiz sürer. Çağrı yerindeki
      # sınır bu arızaya karşı ÇALIŞMAZ; duvar saatiyle kesen sınır çalışır.
      #
      # Genel kural (bkz. CLAUDE.md): sınırsız bir adım, kendisinden SONRA gelen
      # bütün adımların sigortasını yakar. İş bütçesi 65 dk ve sonraki adımların
      # sınırları 40+5+8=53; bu adım on dakika asılsa aritmetik kapanmaz ve
      # 04.09'da olduğu gibi Koşu nabzı ile Commit adımları İŞ zaman aşımına
      # yakalanır (`if: always()` İŞ sınırına karşı çalışmaz). Tavan, ölçülen
      # normal sürenin (5 sn) otuz katından fazla — yanlış alarm payı geniş.
      #
      # Kesilmesi üretimi bozmaz: adım TANIDIR, kararı vermez. `continue-on-error`
      # sınırda düşmeyi de yutar, takvim alınamazsa `_yayimlar` bayat önbellekle
      # devam eder ve hangi hattın koşacağına bir sonraki adım `--gerekli` ile
      # kendisi karar verir.
      - name: Tazeleme takvimi ne diyor (tanı — koşuyu durdurmaz)
        continue-on-error: true
        timeout-minutes: 3
        run: python bulten/tazeleme.py

      # Hafif kip: EVDS'e giden hatlar. Hangi hattın koşacağına --gerekli karar
      # verir; --sistem-kur yalnız o koşuda koşacak hatların paketlerini kurar.
      - name: Gereken hatları tazele
        id: tazele
        # Sınır ÖLÇÜLDÜ, takdirî değil. 25 dakika gerçek süreden düşüktü ve
        # 27.08 12:44 zamanlanmış koşusu bunu gösterdi: dört hattın DÖRDÜ de
        # başarıyla bitti (net rezerv 442s · yabancı 3s · fonlama 209s · kredi
        # 844s = 1.498s ≈ 25,0 dk), özet basıldı, tazeleme damgası güncellendi —
        # ve tam o anda sınır doldu. İş tamamdı, koşu yine de "failure" damgası
        # bıraktı. Bedeli görünür: denetim o damgaya bakıp "bazı hatlar
        # çekilememiş olabilir" diye YANLIŞ uyarı üretti.
        #
        # Sınırın işi hâlâ aynı — kaynağında takılan bir hat koşuyu sonsuza
        # kadar yakmasın. Ama eşiğin normal işin ÜSTÜNDE olması şart, yoksa
        # sağlıklı koşuyu arızalı gösterir. En yavaş iki hat tek başına 21,4
        # dakika (kredi + net rezerv); 40 dakika bunun üzerine hâlâ yeterli pay
        # bırakıyor.
        #
        # 45'ten 40'a ÇEKİLDİ (04.09.2026). Beş dakika burada kaybedilmiyor,
        # yer değiştiriyor: iş bütçesinin kuyruğuna, Hazine adımının sınırına
        # ve commit'e. 04.09'da bu adım 45 dakikayı SONUNA KADAR yaktı ve
        # karşılığında sıfır çıktı alındı, çünkü commit adımına sıra gelmedi.
        # Yarım tazeleme, commit edilmiş yarım tazelemedir; hiç commit
        # edilmemiş tam tazeleme ise hiçbir şeydir.
        #
        # Hangi hattın o 45 dakikayı yediği BİLİNMİYOR (iptal edilen koşunun
        # logları 404). Bu yüzden 40 dakika ölçülmüş bir süre değil, ölçülmüş
        # iş yükünün (25,0 dk, 27.08) üstünde bir tavandır.
        timeout-minutes: 40
        run: |
          HATLAR="${{ inputs.hatlar }}"
          if [ -z "$HATLAR" ]; then
            # `fx` BİLEREK YOK — ayrı iş akışında (fx.yml), haftalık TAM kipte.
            # Burada hafif kipte koşuyordu ve hafif kip GDELT akışını hiç
            # toplamıyor: hat her tetiklendiğinde "tazelendi" damgası atıyor,
            # veri hiç ilerlemiyordu. Takvim onu taze sanıp dokuz gün daha
            # bekliyor, yani veri kalıcı olarak donuyordu — üstelik her koşu
            # yeşil bittiği için sessizce.
            # buyume ve elnino da listede: analiz yazılarındaki canlı sayılar
            # (<Deger>) bu hatlardan beslenir; takvim süzgeci onları yalnız
            # kendi yayım günlerinde (GSYH / TÜFE) koşturur.
            # carry tufex makro reelfx EN SONDA: türev hatlar üst hatların (fonlama,
            # dibs, kredi, enflasyon, tcmb) bu koşuda yazdığı CSV/özetten hesaplanır
            # ve guncelle.py hatları BU SIRAYLA koşturur. Tazeleme takviminde
            # tarifleri yok → her koşuda çalışırlar (saniyeler); reelfx takvimsiz
            # emniyet ağıyla 30 günde bir EVDS'e gider.
            # ypmevduat kredi'nin hemen ardında: ikisi de AYNI yayımdan
            # besleniyor (Haftalık Para ve Banka İstatistikleri, perşembe) ve
            # türev hatlardan önce koşmalı. Hat kütüğe alınmıştı ama bu listede
            # YOKTU: altı cron penceresinin hiçbiri onu çalıştırmıyordu, yani
            # site kopyası hiç oluşmuyor, sayfadaki her canlı değer statik
            # yedekte donuyor ve hiçbir kapı bunu görmüyordu — hat "tam
            # kurulmuş" görünür. Elle tetiklemek de yetmezdi: sonraki haftalar
            # yine hiç tazelenmezdi.
            # ovp EN SONDA ve bunun iki ayrı sebebi var. (1) Hat fonlama ve
            # enflasyon hatlarına BAĞIMLI: taşıma bacağı Fonlama'nın, gerçekleşen
            # enflasyon karşılaştırması Enflasyon'un bu koşuda depoya yazdığı
            # seriden okunuyor; ikisinden önce koşarsa o iki bacak dünkü seriden
            # hesaplanmış kalır. (2) Ama carry/tufex/makro gibi SALT türev
            # değildir: kendi kur serisini EVDS'ten çeker, yani "Türev hatlar"
            # adımına taşınamaz — o adım saniyelik ve `if: always()`, ağa çıkan
            # bir hattı oraya koymak tazeleme düştüğü koşuda onu da düşürürdü.
            # Sıra değişecekse bu iki kısıt birlikte sorulmalı.
            HATLAR="tcmb usdtry reer yabanci fonlama kredi ypmevduat enflasyon dibs odemeler butce marj buyume elnino carry tufex makro reelfx ovp"
          fi
          # "zorla" = takvimi hiç sorma. Süzgeci geçirmemek, ona "her şey
          # gerekli" dedirtmekten daha dürüst: karar defterine sahte tetik yazılmaz.
          KIP=""
          if [ "${{ inputs.tam }}" = "true" ]; then
            # TAM kip DAR olmalı. Bütün hatları kaynaktan yeniden kazımak, bu
            # deponun zaten bir kez ödediği 37 dakikalık faturadır; üstelik
            # aşağıdaki hasar geri alma, tam kipte koşan hatların TAMAMINI
            # geri alır ve geniş bir liste iyi çıktıyı da çöpe atardı.
            if [ -z "${{ inputs.hatlar }}" ]; then
              echo "::error::TAM kip hat listesi ister — 'hatlar' boş bırakılamaz."
              exit 1
            fi
            KIP="--tam"
            echo "TAM kip — seçilen hatlar kaynağa gidip yeniden kazıyacak"
          fi
          if [ "${{ inputs.zorla }}" = "true" ]; then
            echo "Takvim atlandı — seçilen hatlar koşulsuz tazeleniyor"
            # ÖNBELLEK DE ATLANIR. Seri önbelleği 12 saat taze sayılıyor;
            # TÜİK ise ayın 3'ünde 10.00'da yayımlıyor. Sabah koşmuş bir
            # tazeleme, yayımdan SONRA koşana eski dosyayı verir ve hat
            # "veri değişmedi" diyerek yeşil biter — yayım gününde sayfada
            # dünkü ay durur. Elle tetiklenen bir tazelemenin tek sebebi
            # zaten "yeni veri var"; önbelleği dinlemesi anlamsız.
            #
            # BU SATIR 07.09.2026'YA KADAR DOKUZ HATTIN SEKİZİNDE HİÇBİR ŞEY
            # YAPMIYORDU: değişkeni yalnız Enflasyon okuyordu, yani "koşulsuz
            # tazele" düğmesi kalan sekiz hat için önbelleği hiç atlamıyordu ve
            # koşu yeşil bitiyordu. Ölçüldü; kural ortak/tazelik.py'ye TEK tanım
            # olarak taşındı, hatların _taze'si oraya devretti ve
            # bulten/duman.py devretmeyen hattı ENGEL sayıyor.
            export TTO_YENILE=1
            SECIM="$HATLAR $KIP --sistem-kur"
          else
            SECIM="$HATLAR $KIP --gerekli --sistem-kur"
          fi
          # HASAR GERİ ALMA — yalnız TAM kipte. 2026-08-25'te Hazine hattı
          # buluttan kazıyıp 448 ihale yerine 16 buldu ve birikmiş geçmişi
          # ezdi; guncelle.py artık veri tarihi geriye giden hattı DÜŞMÜŞ
          # sayıyor ama dosyaları diske çoktan yazmış oluyor ve commit adımı
          # (if: always()) onu yayardı. O sigorta Hazine adımında vardı,
          # burada YOKTU — yani 'tam' girdisi eklenince aynı kusur bu yoldan
          # geri gelirdi. Hafif kip kaynağa gitmediği için bu riski taşımaz.
          if [ -n "$KIP" ]; then
            if python guncelle.py $SECIM; then
              echo "TAM kip temiz bitti"
            else
              echo "::warning::TAM kip düştü — diskteki değişiklikler geri alınıyor, depodaki birikmiş veri korunuyor."
              git checkout -- "Aktarılacak Projeler" Research site/public/projeler || true
              exit 1
            fi
          else
            python guncelle.py $SECIM
          fi

      # Türev hatlar ağa çıkmaz ve saniyeler sürer: tazeleme adımı düşse ya da
      # zaman sınırına çarpsa bile üst hatların depoya yazdığı seriden panolar
      # kurulur ve ev stili uygulanır (kütük tek kaynak, izolasyon burada).
      - name: Türev hatlar (tazeleme düşse de)
        if: always()
        timeout-minutes: 5
        run: |
          python guncelle.py carry tufex makro
          python site/tools/plotly_stil.py --hepsi >/dev/null

      # Hazine ihaleleri AYRI: hattın hafif kipi yalnız mevcut veriden grafik
      # üretir, ihale listesini TAM kip (main.py) hmb.gov.tr'den kazır. İhale
      # günü geldiğinde tam kip koşar; diğer günlerde bu adım hiç çalışmaz.
      #
      # DİKKAT — 2026-08-25'te bu adım depodaki 448 ihalelik birikmiş geçmişi
      # 16 satıra düşürdü: buluttan yapılan kazıma yerelde alınanın küçük bir
      # altkümesini getiriyor ve hat CSV'yi eklemek yerine BAŞTAN yazıyor.
      # guncelle.py artık veri tarihi geriye giden hattı düşmüş sayıyor; burada
      # ayrıca diskteki hasar geri alınıyor, yoksa commit adımı onu yayardı.
      # if: always() — üstteki tazeleme adımı düşse (ya da 40 dk sınırına çarpsa)
      # bile ihale günü ihale çekilir. İki hattın kaderi birbirine bağlı değil.
      #
      # SINIR ZORUNLU. 04.09.2026'ya kadar bu adımın HİÇ zaman aşımı yoktu:
      # 05:07'de başladı, iş bütçesinin kalan beş dakikalık payını yedi ve
      # 05:12'de iş sınırı dolunca Koşu nabzı ile Commit adımları hiç koşmadı.
      # Sınırsız bir adım, kendisinden SONRA gelen bütün adımların sigortasını
      # yakar. 8 dakika ÖLÇÜLMÜŞ DEĞİL, açıkça GEÇİCİ BİR TAVANDIR: işi
      # "sınırsız"ı bitirmek, doğru sayıyı vermek değil. Hat sürelerinin
      # kaydı biriktiğinde medyandan türetilecek.
      - name: Hazine ihaleleri (ihale günüyse tam kip)
        if: always()
        continue-on-error: true
        # TAVAN ÜÇ PARÇADAN KURULUR VE PARÇALAR YAZILIR:
        #   ön adım 2 + kazıma 19 + geri alma 1 = 22
        # Eski 8 dakika hattın ÖLÇÜLMÜŞ süresinin (bulutta 10–20 dk) ALTINDAYDI
        # ve kendini kilitliyordu: her tam kip 7. dakikada kesiliyor, kesilen
        # koşu süre defterine hiçbir şey yazmadığı için tavan da hiç ölçüye
        # bağlanamıyordu. 06.09 koşusu (#117) böyle düştü ve hazine hattı
        # 18.08'de dondu.
        #
        # 19 ÖLÇÜM DEĞİL TAVAN. Bulutta her koşu SOĞUK tarama: xlsx .gitignore'da
        # olduğu için artımlı erken durma hiç devreye girmiyor ve kazıyıcı 200
        # sayfayı baştan geziyor. Gerçek süre ilk başarılı koşuda süre defterine
        # yazılacak (guncelle.py tam kipte de yazıyor) ve tavan ondan sonra
        # ölçüye çekilecek.
        timeout-minutes: 22
        run: |
          # ÖN ADIM DA SINIRLI. Sınırsızdı ve kabuk `timeout`unun DIŞINDAydı:
          # takvim ucu istek başına 25 sn, üç deneme, iki yıl URL'si — tek
          # başına 1–2,5 dakika yiyebiliyordu. "Sınırsız bir adım, kendisinden
          # SONRA gelen bütün adımların sigortasını yakar" kuralı bir adımın
          # İÇİNDEKİ komutlar için de geçerli.
          GEREK=$(timeout -k 10s 110s python -c "import sys; sys.path.insert(0,'bulten'); import tazeleme; print(' '.join(tazeleme.gerekli(['hazine'])))" || echo "TAKVIM_ZAMAN_ASIMI")
          if [ "$GEREK" = "TAKVIM_ZAMAN_ASIMI" ]; then
            echo "::warning::Hazine tetiği sorulurken takvim ucu 110 saniyede cevap vermedi — adım atlandı, kazımaya vakit bırakıldı."
            exit 0
          fi
          if [ "$GEREK" != "hazine" ]; then
            echo "İhale yok — Hazine hattı atlandı"
            exit 0
          fi
          echo "İhale günü — Hazine sitesi taranıyor (tam kip)"
          # SINIR KABUĞUN İÇİNDE DE OLMAK ZORUNDA. Adımın `timeout-minutes`
          # sınırı dolduğunda GitHub kabuğu da öldürür: aşağıdaki `else` dalı —
          # yani diskteki YARIM kazımayı geri alan `git checkout` — hiç koşmaz
          # ve Commit adımı (`if: always()`) o yarım CSV'yi commit eder.
          # 25.08.2026'da aynı hat depodaki 448 ihalelik geçmişi 16 satıra
          # düşürmüştü; geri alma tam bunun için konmuştu. Adıma tavan konarken
          # (04.09) o tavanın geri almayı da öldürdüğü gözden kaçtı: bir sigorta
          # eklenirken kendisinden ÖNCE konmuş sigortayı kapatıp kapatmadığı
          # sorulur. Kabuk içi `timeout` denetimi kabuğa geri verir (çıkış 124),
          # dıştaki 8 dakika yerinde durur ama artık ona ÇARPILMAZ.
          # 19 dakika adım tavanından TÜRETİLMİŞTİR: 22 eksi ön adıma ayrılan
          # 2 dakika eksi geri almaya bırakılan 1 dakika. Adım tavanı ölçüye
          # bağlandığında bu da onunla iner; bulten/duman.py ikisinin
          # arasındaki sırayı ENGEL olarak sınıyor.
          if timeout -k 30s 19m python guncelle.py hazine --tam --sistem-kur; then
            echo "Hazine hattı tazelendi"
          else
            KOD=$?
            if [ "$KOD" -ge 124 ]; then
              echo "::warning::Hazine tam kipi 7 dakikalık kabuk sınırında kesildi (kaynak asılmış olabilir) — diskteki yarım kazıma geri alınıyor, depodaki birikmiş geçmiş korunuyor."
            else
              echo "::warning::Hazine tam kipi düştü (büyük olasılıkla kazıma eksik veri getirdi) — diskteki değişiklikler geri alınıyor, depodaki birikmiş geçmiş korunuyor."
            fi
            git checkout -- "Aktarılacak Projeler/hazineihrac" "site/public/projeler/hazine-ihrac" || true
          fi

      # NABIZ: bu iş akışının koştuğunun kaydı. tazeleme_durumu.json yalnız
      # BAŞARIYLA TAZELENEN hattın damgasını tutar; sakin bir günde hiçbir hat
      # koşmaz ve o dosya "hat düştü" ile "yapacak iş yoktu" ayrımını veremez.
      # Nabız bu ayrımı verir: koşunun kendisi ne zaman oldu, sonucu neydi.
      # 26.08'de veri hattı düştü ve aşağı akıştaki hiçbir katman bunu bilemedi.
      #
      # DEFTER, TEK KAYIT DEĞİL (04.09.2026). Dosya eskiden her koşuda üzerine
      # yazıyordu; "bu sabahki veri penceresi ateşlendi mi" sorusu bu yüzden
      # geriye dönük cevapsızdı — 04.09 sabahı altı cron'un hiçbiri ateşlenmedi
      # ve depoda bunun izi yoktu. Artık son koşular biriktiriliyor. Üst düzey
      # veri_kosusu/sonuc alanları en son kaydın kopyası olarak KALIYOR:
      # denetim.py ve zincir.py onları okuyor, kırılmıyorlar.
      #
      # Kod ayrı bir modülde (bulten/nabiz.py), burada gömülü değil: gömülü
      # heredoc'u duman sınaması çağıramaz, ancak bir KOPYASINI sınayabilirdi.
      - name: Koşu nabzı
        if: always()
        run: python bulten/nabiz.py
        env:
          ADIM_SONUC: ${{ steps.tazele.outcome || 'koşmadı' }}
          TETIK: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}

      # if: always() ŞART. 2026-08-27 koşusunda dört hattın ÜÇÜ başarıyla
      # tazelendi (USDTRY 27.08'e geçti, fonlama ve DİBS koştu) ve 37 dakikalık
      # işin tamamı çöpe gitti: tek bir hat (tcmb) EVDS'te zaman aşımına uğradı,
      # adım kırmızı bitti ve commit adımı hiç koşmadı. Kısmî başarı, başarısızlık
      # değildir; tazelenen hattın verisi düşen hattın kaderini paylaşmaz.
      - name: Commit
        if: always()
        run: |
          git config --global user.name  "tto-veri"
          git config --global user.email "bot@users.noreply.github.com"
          # hat_suresi.json: her hattın ölçülmüş koşu süresi. Commit edilmeyen
          # bir ölçüm ölçülmemiş sayılır — bütçe ve sıralama bu dosyadan türer.
          git add "Aktarılacak Projeler" Research site/public/projeler bulten/tazeleme_durumu.json bulten/kosu_nabzi.json bulten/hat_suresi.json bulten/onbellek || true
          if git diff --cached --quiet; then
            echo "veri değişmedi — commit yok"
          else
            git commit -m "veri: $(date -u +'%Y-%m-%d %H:%M') tazeleme (otomatik)"
            # ÜRETİLEN DOSYA ÇAKIŞMASI KOŞUYU DÜŞÜRMEZ. İki tazeleme peş peşe
          # koştuğunda ikincisi, birincisinin push'undan ÖNCEKİ sha'yı checkout
          # etmiş olur; ikisi de ozet.json'u yeniden ürettiği için rebase
          # içerik çakışması verir ve koşu, TAZE VERİYİ HESAPLADIKTAN SONRA
          # düşer — 03.09'da ağustos TÜFE'si böyle kayboldu. Bu dosyalar
          # üretim çıktısı: doğru sürüm her zaman EN SON HESAPLANANDIR.
          # Rebase sırasında -X theirs, yeniden uygulanan (bizim) commit'i
          # tercih eder.
          # PUSH YARIŞI KOŞUYU DÜŞÜRMEZ. pull ile push arasında başka bir
          # itme düşerse push REDDEDİLİR ve hesaplanan veri, tam da
          # hesaplandıktan sonra çöpe gider — 03.09'da iki kez böyle oldu.
          # Reddedilen her denemede yeniden rebase edilip tekrar denenir.
          for deneme in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs || true
            if git push; then
              echo "push tamam (deneme $deneme)"
              break
            fi
            if [ "$deneme" = "5" ]; then
              echo "::error::push beş denemede de reddedildi."
              exit 1
            fi
            echo "::warning::push reddedildi (deneme $deneme) — yeniden deneniyor."
            sleep $((deneme * 5))
          done
          fi
