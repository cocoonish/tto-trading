# Tweet zinciri — yazılmış bültenleri X'e gönderir.
#
# İçerik yalnız YAYIMLANMIŞ katmandan gelir (yazı kapısından geçmiş bülten,
# yorum kapısından geçmiş teknik analiz); zincir metnini tweet/uret.py kurar,
# gönderimi tweet/gonder.py yapar. Sigortalar araçta: defter aynı içeriği iki
# kez göndermez, bayat koruması dünkü bülteni bugünmüş gibi atmaz, TW_*
# anahtarları yoksa koşu KURU geçer (zincir loga basılır, hiçbir şey
# gönderilmez, iş yeşil biter) — yani bu iş akışı anahtarlar eklenmeden de
# zararsızca çalışır.
#
# Tetikler: yazı katmanının push'u (bülten/teknik JSON'ları değişince) +
# yedek cron'lar (zamanlanmış tetikleyicinin sicili gereği) + elle.

name: Tweet zinciri

on:
  push:
    branches: [main]
    paths:
      - 'site/src/data/bulten/**'
      - 'site/src/data/teknik/**'
  schedule:
    - cron: '35 5 * * 1-5'    # 08:35 İstanbul — sabah bülteninin yazısından sonra
    - cron: '25 15 * * 0'     # 18:25 İstanbul — pazar haftalık + teknik sonrası
    - cron: '25 18 * * 0'     # 21:25 İstanbul — pazar yedeği
  workflow_dispatch:
    inputs:
      kuru:
        description: 'Kuru koşu — gönderme, yalnız zinciri bas'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tweet
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # OAuth 2.0 kullanıcı bağlamı. Refresh token TEK KULLANIMLIK ve her
      # koşuda döner; güncel hâli tweet/oauth2.enc'de ŞİFRELİ tutulur (anahtar
      # TW_KILIT) ve aşağıda commit'lenir. TW_REFRESH_TOKEN yalnız İLK kurulum
      # içindir — oauth2.enc doğduktan sonra okunmaz.
      TW_CLIENT_ID: ${{ secrets.TW_CLIENT_ID }}
      TW_CLIENT_SECRET: ${{ secrets.TW_CLIENT_SECRET }}
      TW_KILIT: ${{ secrets.TW_KILIT }}
      TW_REFRESH_TOKEN: ${{ secrets.TW_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıklar
        run: pip install --quiet requests cryptography

      - name: Duman sınaması
        run: python tweet/duman.py

      - name: Zinciri gönder
        run: python tweet/gonder.py ${{ github.event.inputs.kuru == 'true' && '--kuru' || '' }}

      # Defter VE jeton dosyası gönderimden SONRA commit'lenir. oauth2.enc'in
      # commit'i KRİTİK: X refresh token'ı her koşuda döndürür, dönen jeton
      # commit'lenmezse bir sonraki koşu ölü jetonla açılır ve kimlik düşer.
      # if: always() bu yüzden — gönderim yarıda ölse bile yenilenmiş jeton
      # depoya girmeli.
      - name: Defter ve jetonu commit'le
        if: always()
        run: |
          git config --global user.name  "tto-tweet"
          git config --global user.email "bot@users.noreply.github.com"
          # AYRI AYRI: git add, listedeki TEK bir yol bile yoksa komutun
          # TAMAMINI reddeder ve hiçbir şey sahnelenmez. 30.08'de defter.json
          # henüz doğmamışken bu satır tekti ve yenilenmiş oauth2.enc
          # commit'lenemedi — tek kullanımlık refresh token koşucuyla birlikte
          # kayboldu, eldeki secret ölü kaldı.
          git add tweet/defter.json 2>/dev/null || true
          git add tweet/oauth2.enc  2>/dev/null || true
          if git diff --cached --quiet; then
            echo "defter ve jeton değişmedi"
          else
            git commit -m "tweet: $(date -u +'%Y-%m-%d') defter/jeton (otomatik)"
            git pull --rebase --autostash
            git push
          fi
