# NÖBETÇİ — bülten çıktı mı, çıkmadıysa SES ÇIKAR.
#
# Neden var: 27.08.2026'da bülten yayına HİÇ çıkmayacaktı ve bunu kimse
# öğrenmeyecekti. Zincirin ilk iki halkası (veri tazeleme 02:13, ölçüm 03:23)
# GitHub'ın zamanlayıcısına bağlı ve o gün ikisi de hiç başlamadı. Aşağı
# akıştaki hiçbir katman bunu göremiyordu: yayın iş akışı "değişiklik yok"
# deyip yeşil bitiyor, site dünkü bülteni göstermeye devam ediyor. Yani
# ARIZANIN GÖRÜNTÜSÜ İLE SAĞLIĞIN GÖRÜNTÜSÜ AYNI.
#
# Bu iş o boşluğu kapatır. Tek işi var: sabahın sonunda bugünün bülteni
# YAZILMIŞ mı diye bakar. Yazılmışsa sessizce geçer. Yazılmamışsa DÜŞER —
# ve düşen bir iş akışı depo sahibine e-posta gönderir. Alarmın kendisi
# ürün: onarım değil, haber vermek.
#
# Onarmıyor olması bilinçli. Eksik ölçümü buradan koşturmak zinciri bir adım
# ilerletirdi ama bülteni YAYINA çıkarmazdı: sayfanın yayın kapısı yazılmış
# bülten istiyor (site/src/pages/bulten/index.astro) ve yazıyı ancak yazı
# katmanı yazabilir. Öyleyse buradan çıkması gereken şey iş değil, HABER.
#
# Saat seçimi kayda dayanıyor: bu depoda 02:00–04:30 UTC penceresindeki
# zamanlanmış koşular sistematik olarak düşüyor, 06:00–16:00 arasındakiler
# (gecikmeli de olsa) koşuyor. Nöbetçi bu yüzden 06:37'de.
#
# ROL DEĞİŞTİ (04.09.2026) — NÖBETÇİ ARTIK YEDEK.
#
# Birincil alarm `gecikme.yml`e geçti ve o CRON TAŞIMIYOR: başka iş
# akışlarının `requested`/`completed` olaylarıyla ve push'la uyanıyor. Sebep
# 04.09 sabahında ölçüldü — o gün nöbetçi HİÇ ateşlenmedi (son koşusu 03.09
# 14:42), yani alarm izlediği zamanlayıcıyla hata kaynağını paylaşıyordu.
# Ateşlenseydi bile YEŞİL geçecekti: bülten 05:50'de yazılmıştı ve nöbetçi
# YOKLUK soruyor, GECİKME değil.
#
# Peki neden silinmiyor? Çünkü `gecikme.yml`in kendi kör noktası var: onu
# hiçbir olay uyandırmazsa (bütün iş akışları düşerse, hiç push olmazsa) o da
# susar. İki taşıyıcı, TEK ölçü: biri olay tetikli (asıl), biri cron'lu
# (yedek). Yokluk sorusu da burada kalıyor — gecikme ölçüsü "söz verilen
# saatte yerinde miydi" diye sorar, nöbetçi "site bugünün sayısını gösteriyor
# mu" diye; ikisi aynı soru değil.
#
# Nöbetçinin SAATİ değişmedi. Sözün hemen ardına (05:26Z) çekmek, deponun
# kendi kaydıyla çelişirdi: erken ölçüm yapabilmesi için erken olması gerekir
# ama erken olduğu için ateşlenmeyebilir. Erken uyarı işi cron'suz olana
# verildi.

name: Nöbetçi (bülten çıktı mı)

on:
  schedule:
    - cron: '37 6 * * 1-5'    # 09:37 İstanbul — sabah bülteni çoktan çıkmış olmalı
    # YEDEK ALARMLAR. Nöbetçinin işi zamanlayıcı düştüğünde alarm vermek — ama
    # kendisi de aynı zamanlayıcıda. 28.08.2026 sabahı ölçüldü: 06:37 nöbetçisi
    # dahil sabah penceresinin TAMAMI (fx 01:53, veri 02:13/02:41, ölçüm
    # 03:23/03:51, yayın 05:11) hiç ateşlenmedi; bülten yalnız yazı rutini elle
    # tetiklediği için çıktı. Nöbetçi hiç koşmazsa düşemez de — arızanın
    # görüntüsü yine sağlığın görüntüsüyle aynı olur. Öğlene doğru pencereler
    # fiilen çalışıyor (27-28.08'in bütün zamanlanmış koşuları 12:44'ten sonra
    # ateşlendi); yedekler oraya konuldu. Bülten yazılmışsa koşu saniyeler
    # içinde yeşil biter, mükerrer alarm üretmez.
    - cron: '7 8 * * 1-5'     # 11:07 İstanbul — birinci yedek
    - cron: '37 10 * * 1-5'   # 13:37 İstanbul — ikinci yedek
    - cron: '31 16 * * 0'     # 19:31 İstanbul — pazar "haftaya bakış" için
    - cron: '1 18 * * 0'      # 21:01 İstanbul — pazar yedeği
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nobet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # zincir.py çıkış kodları: 0 ölçüm hazır ama yazı yok · 1 ölçüm eksik
      # ya da boş · 2 bülten yazılmış (İYİ) · 3 cumartesi (İYİ).
      # Tek koşu, tek karar: `set +e` şart, çünkü adımlar `bash -e` altında
      # koşuyor ve sıfırdan farklı çıkış kodu yakalanmadan işi düşürürdü.
      - name: Bülten çıktı mı
        run: |
          set +e
          python bulten/zincir.py
          kod=$?
          set -e
          echo
          case "$kod" in
            # 4 = pazar: bülten yazılmış, teknik bekliyor — BU sorunun cevabı
            # "bülten yerinde"; teknik sorusunu aşağıdaki ayrı adım soruyor.
            2|3|4)
              echo "✓ Bülten yerinde — nöbetçi sessiz geçiyor." ;;
            0)
              echo "::error::BÜLTEN YAZILMAMIŞ — ölçüm hazır ama yazı katmanı koşmamış ya da push edememiş. Sayfa dünkü bülteni gösteriyor."
              exit 1 ;;
            1)
              echo "::error::BÜLTEN ZİNCİRİ KOPUK — bugünün ölçümü yok ya da boş ölçüyle üretilmiş. Yukarıdaki rapor hangi iş akışının tetikleneceğini söylüyor."
              exit 1 ;;
            *)
              echo "::error::Nöbetçi zincirin durumunu okuyamadı (çıkış kodu $kod)."
              exit 1 ;;
          esac

      # Depoda yazılmış olması yetmez: SİTE onu gösteriyor mu? Yayın iş akışı
      # token yoksa yeşil biter, tetikleyicisi düşerse sessiz kalır — "yazıldı
      # ama siteye çıkmadı" hâlini depoya bakan hiçbir ölçüt göremez. Bülten
      # beslemesinin ilk maddesi bugünün adresini taşımıyorsa alarm.
      - name: Site bugünün sayısını gösteriyor mu
        run: |
          set +e
          python bulten/zincir.py >/dev/null 2>&1; kod=$?
          set -e
          case "$kod" in 2|4) ;; *) echo "bülten yazılmamış ya da cumartesi — site denetimi atlandı"; exit 0;; esac
          bugun=$(date -u +%Y-%m-%d)
          besleme=$(curl -fsS --max-time 30 https://cocoonish.github.io/bulten/rss.xml || true)
          if [ -z "$besleme" ]; then
            echo "::warning::bülten beslemesi okunamadı (ağ ya da yayın) — site denetimi sonuçsuz"
            exit 0
          fi
          ilk=$(printf '%s' "$besleme" | grep -o '<link>[^<]*</link>' | sed -n '2p')
          case "$ilk" in
            *"/bulten/$bugun/"*) echo "✓ Site bugünün sayısını gösteriyor: $ilk" ;;
            *) echo "::error::SİTE BUGÜNÜN SAYISINI GÖSTERMİYOR — beslemenin ilk maddesi: $ilk (beklenen /bulten/$bugun/). Yayın iş akışı düşmüş ya da tetiklenmemiş olabilir."; exit 1 ;;
          esac

      # Pazar günleri ikinci soru: HAFTALIK TEKNİK ANALİZ yazıldı mı?
      # Teknik bülteni de rutin yazar (bkz. bulten/YAZIM.md) ve rutin metnine
      # güvenilmez — sigorta araca konur. Ölçüm var ama yorum yoksa ya da
      # ölçüm hiç koşmadıysa alarm; sayfa yayın kapısı gereği eski sayıyı
      # göstermeye devam eder ve bunu başka hiçbir katman fark edemez.
      - name: Teknik bülten çıktı mı (yalnız pazar)
        run: |
          if [ "$(date -u +%u)" != "7" ]; then
            echo "hafta içi — teknik bülten pazar işi, atlandı"
            exit 0
          fi
          python - <<'PY'
          import json, sys, datetime as dt
          from pathlib import Path
          bugun = dt.datetime.now(dt.timezone.utc).date().isoformat()
          yol = Path(f"site/src/data/teknik/{bugun}.json")
          if not yol.exists():
              print(f"::error::TEKNİK ÖLÇÜM YOK — {yol} üretilmemiş; "
                    "'Haftalık teknik analiz' iş akışı koşmamış.")
              sys.exit(1)
          b = json.loads(yol.read_text(encoding="utf-8"))
          if not b.get("yazili"):
              print("::error::TEKNİK BÜLTEN YAZILMAMIŞ — ölçüm hazır ama yorum "
                    "katmanı koşmamış ya da push edememiş. Sayfa eski sayıyı gösteriyor.")
              sys.exit(1)
          print("✓ Teknik bülten yerinde.")
          PY

      # YEDEK GECİKME ALARMI — aynı ölçü, ikinci taşıyıcı.
      #
      # Birincil kanal `gecikme.yml` cron'suz uyanır; bu adım onun hiç
      # uyanmadığı hâle karşı ikinci şanstır. Ölçünün TEK tanımı yine
      # `bulten/gecikme.py` — burada yeni bir eşik kurulmuyor, o dosyanın
      # `tekrar()` fonksiyonu çağrılıyor. İki kapı iki ayrı tanım tutsaydı
      # bir gün sessizce ayrışır ve hangisinin neyi gördüğü kimsenin aklında
      # kalmazdı.
      #
      # TEK GÜN DÜŞÜRMEZ, bilerek. Bu depodaki arızalar gün-biçimli ve tek
      # günün gecikmesi gürültüden ayrılamaz; ayrıca birincil kanal o günü
      # zaten bildirmiş olur — nöbetçinin aynı günü ikinci kez bildirmesi
      # mükerrer alarm demektir. Eşik `tekrar()`: son beş YAYIN gününün en az
      # üçü uyarı/alarm. Pencere bir ÖLÇÜM DEĞİL, yöntemsel bir seçimdir
      # ("bir iş haftası") ve kodda adıyla durur; yirmi gözlem birikince
      # gecikme dağılımından yeniden türetilmeli.
      #
      # YALNIZ BÜLTEN YAZILMIŞKEN koşar (zincir kodu 2 ya da 4). Yazılmamışsa
      # yukarıdaki yokluk alarmı zaten ötüyor; ikisi birden ötseydi tek arıza
      # iki e-posta üretirdi.
      - name: Gecikme tekrar ediyor mu (yedek kanal)
        if: always()
        run: |
          set +e
          python bulten/zincir.py >/dev/null 2>&1; kod=$?
          set -e
          case "$kod" in
            2|4) ;;
            *) echo "bülten yazılmamış ya da yayın günü değil — gecikme yedeği atlandı"; exit 0;;
          esac
          python - <<'PY'
          import sys
          sys.path.insert(0, "bulten")
          import gecikme
          var, gerekce = gecikme.tekrar()
          if var:
              print(f"::error::GECİKME TEKRAR EDİYOR — {gerekce}. Tek gün "
                    "gürültü olabilir, tekrar eden gecikme sözün tutulmadığının "
                    "ölçüsüdür: ya zincir hızlanmalı ya da yayın takvimindeki "
                    "saat gerçeğe çekilmeli.")
              sys.exit(1)
          print(f"✓ Gecikme tekrar etmiyor — {gerekce}")
          PY
