# Keşif koşusu — bir veri kaynağının GERÇEKTEN ne sunduğunu ölçer.
#
# Neden ayrı iş akışı: bu oturumların çıkış politikası VERİ KAYNAKLARININ
# TAMAMINI kapatıyor, EVDS anahtarı da yalnız depo secret'ında duruyor.
# Kapsam 05.09.2026'da ölçüldü ve önce DAR yazılmıştı ("tcmb.gov.tr ve TÜİK"):
# vekilin kendi kaydına göre evds3.tcmb.gov.tr, www.tcmb.gov.tr, data.tuik.gov.tr,
# api.worldbank.org ve api.stlouisfed.org'un HEPSİ aynı gerekçeyle reddediliyor
# (ağ geçidi CONNECT'e 403). Açık olan yalnız geliştirme altyapısı (GitHub, npm,
# PyPI). Ayrım önemli: dar yazım, sonraki oturuma "öyleyse Dünya Bankası
# açıktır" dedirtir ve yoklanmadan hat kurdurur. Yeni bir hat
# kurulmadan önce seri kodlarının var olduğunu, biriminin ve frekansının ne
# olduğunu ÖLÇMEK gerekiyor — uydurma seri kodu hatta girmesin. Bu ihtiyaç
# depoda üçüncü kez çıktı (TCMB APİ, ödemeler dengesi, şimdi GSYH) ve her
# seferinde veri.yml geçici olarak bozulup geri alınmıştı; kalıcı araç daha
# temiz. Yalnız ELLE tetiklenir, hiçbir şeye commit ATMAZ — çıktı logdadır.

name: Keşif (veri kaynağı ölçümü)

on:
  workflow_dispatch:
    inputs:
      betik:
        description: 'Koşulacak keşif betiği (depo yolu)'
        type: string
        default: 'Aktarılacak Projeler/Buyume/kesif.py'
      argumanlar:
        description: 'Betiğe geçilecek argümanlar (ör. daraltılacak grup kodları)'
        type: string
        default: ''
      # Keşif bazen bir HATTIN KENDİ betiğini koşturmak ister (ör. Hazine
      # kazıyıcısını, düştüğü yeri kısa bir logda görmek için). O betiklerin
      # bağımlılıkları keşfin sabit listesinde yok ve hepsini buraya yazmak
      # her keşif koşusunu yavaşlatırdı; çağıran ne gerekiyorsa onu söyler.
      paketler:
        description: 'Ek pip paketleri (boşlukla ayrık)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
      PYTHONPATH: ortak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıklar
        run: pip install --quiet requests pandas openpyxl ${{ inputs.paketler }}
      - name: Anahtar var mı
        run: |
          if [ -z "${TTO_EVDS_KEY}" ]; then
            echo "::error::TTO_EVDS_KEY tanımlı değil — keşif EVDS'e çıkamaz."
            exit 1
          fi
      # `-u` ŞART. Python stdout'u tty OLMAYAN yere TAMPONLUYOR ve uzun bir
      # keşifte bu, ilerlemenin HİÇ görünmemesi demek: 02.09'da yirmi dakikalık
      # bir koşu tek satır yazmadan iptal edildi ve tamponla birlikte ölçülen
      # her şey gitti. Ders CLAUDE.md'ye yazılmıştı ama araca konmamıştı.
      - name: Keşif
        run: python -u "${{ inputs.betik }}" ${{ inputs.argumanlar }}
