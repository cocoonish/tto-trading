# Tek seferlik özel tweet — elle tetiklenir, görselli gönderim.
#
# Düzenli bülten tweetlerinin (tweet.yml) dışındaki gönderiler: tema/veri
# tweetleri, grafikli duyurular. Metin depoda bir dosyada durur (gözden
# geçirilebilir), görseller istenirse bir grafik betiğiyle koşu içinde
# üretilir. Kimlik ve jeton kasası tweet.yml ile ortak; dönen refresh token
# burada da commit'lenir.

name: Özel tweet

on:
  workflow_dispatch:
    inputs:
      metin:
        description: 'Tweet metni dosyası (depo yolu) — boş bırakılırsa iş düşer; gönderilmiş bir dosya varsayılan olarak durmaz'
        type: string
        default: ''
      # Grafik İSTİSNADIR: varsayılan boş. Önceden kredi betiğine bağlıydı ve
      # ilgisiz her gönderimde matplotlib koşup 403 alan bir yükleme deniyordu
      # (GitHub boş dizgeyi de varsayılana çevirdiği için kapatmak da mümkün
      # değildi). Grafik isteyen çağrı yolunu açıkça verir.
      grafik_betigi:
        description: 'Önce koşulacak grafik betiği (boş = grafik üretme)'
        type: string
        default: ''
      resimler:
        description: 'Eklenecek PNGler (boşlukla ayrık depo yolları)'
        type: string
        default: ''
      gonder:
        description: 'Gerçekten gönder (kapalıysa kuru koşu)'
        type: boolean
        default: false
      sil_id:
        description: 'Önce bu id''li tweeti sil (düzeltme akışı)'
        type: string
        default: ''
      anahtar:
        description: 'Defter anahtarı (ör. analiz:<slug>); boş = ozel:<dosya kökü>. Aynı anahtar ikinci kez gönderilmez.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: tweet
  cancel-in-progress: false

jobs:
  ozel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TW_CLIENT_ID: ${{ secrets.TW_CLIENT_ID }}
      TW_CLIENT_SECRET: ${{ secrets.TW_CLIENT_SECRET }}
      TW_KILIT: ${{ secrets.TW_KILIT }}
      TW_REFRESH_TOKEN: ${{ secrets.TW_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıklar
        run: pip install --quiet requests cryptography matplotlib pandas

      - name: Duman sınaması
        run: python tweet/duman.py

      - name: Grafikler
        if: inputs.grafik_betigi != ''
        run: python ${{ inputs.grafik_betigi }}

      - name: Gönder
        run: |
          if [ -z "${{ inputs.metin }}" ]; then echo "::error::metin dosyası verilmedi"; exit 1; fi
          RESIMLER=""
          for r in ${{ inputs.resimler }}; do RESIMLER="$RESIMLER --resim $r"; done
          SIL=""
          if [ -n "${{ inputs.sil_id }}" ]; then SIL="--sil ${{ inputs.sil_id }}"; fi
          ANAHTAR=""
          if [ -n "${{ inputs.anahtar }}" ]; then ANAHTAR="--anahtar ${{ inputs.anahtar }}"; fi
          ZORLA=""
          if [ -n "${{ inputs.sil_id }}" ]; then ZORLA="--zorla"; fi
          python tweet/ozel.py --metin "${{ inputs.metin }}" $RESIMLER $SIL $ANAHTAR $ZORLA \
            ${{ inputs.gonder == true && '--gonder' || '' }}

      # Jeton kasası: gönderim koşusu refresh token'ı döndürür; kaybolmasın.
      - name: Jeton, defter ve arşivi commit'le
        if: always()
        run: |
          git config --global user.name  "tto-tweet"
          git config --global user.email "bot@users.noreply.github.com"
          git add tweet/oauth2.enc 2>/dev/null || true
          git add tweet/defter.json tweet/arsiv site/src/data/tweet 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "jeton değişmedi"
          else
            git commit -m "tweet: $(date -u +'%Y-%m-%d') jeton (özel gönderim)"
            git pull --rebase --autostash
            git push
          fi
