# Siteyi public depoya yayınla — bu depoya her içerik commit'inde.
#
# Neden ayrı iş akışı: yayın eskiden bülten işinin son adımıydı, dolayısıyla
# yalnız bülten koştuğunda siteye çıkıyordu. Artık üç ayrı yerden içerik
# geliyor: veri tazeleme (günde dört kez), bülten ölçümü (günde bir) ve yazı
# katmanı (bulut rutini). Üçünün de sonucu siteye çıkmalı.

name: Siteyi yayınla

on:
  # GitHub, kendi GITHUB_TOKEN'ıyla atılan push'larda yeni iş akışı TETİKLEMEZ
  # (sonsuz döngü koruması). Veri tazeleme ve bülten işleri commit'i o token'la
  # attığı için yalnız `push` tetikleyicisi onları kaçırırdı; bu yüzden o iki
  # işin bitişi ayrıca dinleniyor.
  # FX iş akışı listeye SONRADAN eklendi ve eksikliği hemen görüldü: haftalık
  # tam kip koşusu 26.08'de veriyi tazeleyip commit'ledi ama yayın hiç
  # tetiklenmedi — commit GITHUB_TOKEN'la atıldığı için `push` tetikleyicisi
  # zaten susuyor, bu liste de o iş akışını tanımıyordu. Veri üreten HER iş
  # akışı buraya yazılmalı; yenisi eklenirken bu satır da güncellenmeli.
  workflow_run:
    workflows:
      - "Veri tazeleme"
      - "Günlük bülten"
      - "FX haber endeksi"
      - "Haftalık teknik analiz"
    types: [completed]
  # Yazı katmanı (bulut rutini) ve yereldeki push'lar için.
  #
  # YALNIZ site/** — 'bulten/**' listeden ÇIKARILDI. yayinla.py public depoya
  # yalnız `site/` klasörünü kopyalar; bültenin JSON'u da zaten orada duruyor
  # (site/src/data/bulten/). `bulten/` altındaki her şey ölçüm kodu, rehber ve
  # iç defterler — hiçbiri siteye çıkmıyor. Bu yol kalıbı yüzünden bir .py ya da
  # .md düzenlemesi bile yayın koşusu doğuruyor, koşu hiçbir şey kopyalamadan
  # bitiyordu. 26.08'de "No jobs were run" ile düşen iki koşudan biri tam olarak
  # buydu: değişen tek dosya bulten/YAZIM.md idi, yani başarıyla koşsa bile
  # yayınlayacak hiçbir şeyi yoktu. Boşuna koşu = boşuna hata bildirimi.
  push:
    branches: [main]
    paths:
      - 'site/**'
  # YAKALAMA KOŞUSU. Yukarıdaki iki tetikleyici tek bir şeye karşı savunmasız:
  # GitHub'ın koşuya makine ATAYAMAMASI. O durumda iş hiç başlamadan
  # "startup_failure" ile biter ("No jobs were run") ve o içerik, bir sonraki
  # tetikleyiciye kadar siteye çıkmaz. 26.08'de iki yayın koşusu böyle düştü
  # (aynı dosya 14:55'te ve 16:03'te sorunsuz koştu; arada bir veri koşusu da
  # 51 dakika kuyrukta bekledi).
  #
  # Veri koşuları günde dört kez tetiklediği için çoğu kaçak kendiliğinden
  # kapanıyor. Kapanmayan tek yer en önemlisi: sabah bülteni. Yazı katmanı
  # 07:15'te başlar, ~07:35'te push eder; o push'un yayını düşerse bülten
  # 11:47'deki veri koşusuna kadar sitede olmaz. Bu koşu o dört saatlik
  # boşluğu kapatıyor. Değişiklik yoksa yayinla.py hiçbir şey yapmaz.
  #
  # workflow_run TETİKLEYİCİSİ HER ZAMAN ATEŞLENMİYOR. 26.08 16:22'de veri
  # koşusu başarıyla bitip veriyi commit'ledi, ama bitişine bağlı yayın koşusu
  # hiç oluşmadı — içerik depoda kaldı, siteye çıkmadı (aynı gün 14:55'te aynı
  # tetikleyici düzgün çalışmıştı, yani tetikleyici GÜVENİLİR DEĞİL). Kaçan
  # yayın bir sonraki tetikleyiciye kadar bekliyor; akşam koşusundan sonra bu
  # ertesi sabaha kadar, sabah bülteninden sonra ise öğlene kadar sürebilir.
  schedule:
    - cron: '11 5 * * 1-5'    # 08:11 İstanbul — sabah bülteninin yazısından sonra
    - cron: '11 16 * * 1-5'   # 19:11 İstanbul — günün son veri koşusundan sonra
    - cron: '41 15 * * 0'     # 18:41 İstanbul — pazar haftalık yazısından sonra
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YAYIN_TOKEN: ${{ secrets.TTO_YAYIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      # YAYIN KAPISI: site DERLENMEDEN ve SINANMADAN public depoya çıkmaz.
      # Eskiden public depoya ham kaynak kopyalanıyor ve derleme yalnız orada,
      # Pages iş akışında yapılıyordu: derleme düşerse site sessizce eski
      # sürümde kalıyordu (30.08.2026: şema geçişi bütün derlemeyi düşürdü ve
      # bunu ancak bir sonraki push onardı). Şimdi derleme burada, kopyalamadan
      # ÖNCE koşar; düşerse yayın durur ve düşen iş akışı e-posta gönderir —
      # arızanın görüntüsü sağlığın görüntüsünden ayrılır.
      #
      # Sayfa sınavı da aynı kapının parçası: <Deger> anahtarları, KaTeX,
      # derlenmiş çıktıdaki ham etiketler, okur dili, analiz biçimi. Kaynağı
      # bozan bir içerik commit'i public depoya hiç ulaşmaz.
      - name: Bağımlılıklar (site)
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Derleme
        working-directory: site
        run: npm run build

      - name: Sayfa sınavı
        run: python3 site/tools/sayfa_sinavi.py

      - name: Token var mı
        id: token
        run: |
          if [ -z "${YAYIN_TOKEN}" ]; then
            echo "::warning::TTO_YAYIN_TOKEN yok — yayın atlandı."
            echo "var=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "var=evet" >> "$GITHUB_OUTPUT"
          fi

      - name: Public depoya gönder
        if: steps.token.outputs.var == 'evet'
        run: |
          # Kimlik --global olmalı: yayinla.py depo dışındaki /tmp klonunda
          # commit atıyor ve depo içi git ayarı oraya taşınmıyor.
          git config --global user.name  "tto-yayin"
          git config --global user.email "bot@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${YAYIN_TOKEN}@github.com/cocoonish/cocoonish.github.io.git" /tmp/yayin
          # --derleme-yok: derleme yukarıda zaten koştu ve geçti.
          python yayinla.py --derleme-yok --klon /tmp/yayin -m "içerik: $(date -u +'%Y-%m-%d %H:%M')"
