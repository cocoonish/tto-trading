# FX Haber-Duyarlılık Endeksi — HAFTALIK, TAM KİP.
#
# Neden ayrı bir iş akışı: bu hat günlük veri iş akışına sığmıyor ve orada
# durması ZARARLIYDI. `veri.yml` hatları HAFİF kipte koşturur — hafif kip
# mevcut veriden grafik çizer, GDELT haber akışını HİÇ toplamaz. Hat her
# tetiklendiğinde koşuyor, "tazelendi" damgasını atıyor ve veri hiç
# ilerlemiyordu; takvim de onu taze sanıp dokuz gün daha bekliyordu. Yani
# hattın verisi 18.08'de dondu ve bu kendi kendine düzelemezdi — sessiz,
# çünkü her koşu yeşil bitiyordu.
#
# Doğrusu: hattı günlük listeden çıkarmak ve GERÇEKTEN tazeleyen kipi kendi
# ritminde koşturmak. Endeks zaten HAFTALIK (config.LOOKBACK_DAYS = 7,
# haftalık skorlar), o yüzden haftalık koşu ölçünün kendi ritmi.
#
# Ağırlık: torch + transformers + FinBERT modeli (~440 MB). İki önbellek bunu
# haftada birkaç dakikaya indiriyor: pip ve Hugging Face model deposu.
# FinBERT skorlaması ZATEN ARTIMLI — run.py yalnız "score" alanı olmayan
# makaleleri puanlar, yani 52 haftalık arşiv her koşuda baştan işlenmez.

name: FX haber endeksi

on:
  schedule:
    # PAZARTESİ, Pazar değil. Hat GDELT'i HAFTA HAFTA çekiyor ve en yeni
    # haftayı `now - 1 hafta`nın içinde bulunduğu hafta olarak seçiyor
    # (news_fetcher.fetch_historical_news). Hafta sınırı Pazartesi 00:00 –
    # Pazar 23:59.
    #
    # Pazar sabahı koşunca `now - 1 hafta` bir önceki Pazar'a düşüyor, yani
    # en yeni hafta O GÜN KAPANACAK hafta değil, bir öncekiydi: rejim ve
    # korelasyon panelleri koşudan KALICI olarak 7 gün geride kalıyordu.
    # Üstelik Pazar 08:37'de o hafta zaten kapanmamıştı (23:59'da kapanır).
    #
    # Pazartesi 08:37 UTC = 11:37 İstanbul: hafta 8,6 saat önce kapandı,
    # `now - 1 hafta` onun içine düşüyor ve gecikme 7 günden 1 güne iniyor.
    - cron: '37 8 * * 1'
    # GÜNLÜK KİP — hafta içi Salı-Cuma 09:07 UTC (12:07 İstanbul).
    #
    # Hattın iki ayrı toplaması var ve ritimleri farklı: anlık endeks canlı
    # haber akışından (Google RSS, 7 günlük pencere) gelir ve HER GÜN
    # ilerleyebilir; rejim/korelasyon panelleri GDELT haftalık arşivinden
    # gelir ve yalnız hafta kapanınca ilerler. Tek bir haftalık koşu, günlük
    # ilerleyebilecek yarıyı da haftalığa mahkûm ediyordu.
    #
    # SAAT: BÜLTENDEN ÖNCE. Bülten ölçümü 03:23 UTC'de koşuyor; endeks 09:07'de
    # tazelenirse bültenin gördüğü okuma her zaman bir gün eskidir ve denetimin
    # tazelik ölçütü de dünü ölçer. 01:53, ölçümden 90 dakika önce — ayrı iş
    # akışı olduğu için gecikse bile bülteni BLOKLAMAZ, yalnız o sabah eski
    # okumayla yazılır.
    #
    # Pazartesi de bu listede: o günkü tam kip 08:37'de, yani bültenden SONRA
    # koşuyor. Pazartesi sabahı da taze okuma olsun diye günlük kip pazartesi
    # de çalışır; 08:37'deki tam kip ardından haftalık arşivi tazeler.
    - cron: '53 1 * * 1-5'
    # YEDEK. 28.08.2026'da 01:53'ün İLK ateşlemesi hiç olmadı — o sabah bütün
    # erken pencere düştü. Öğlen penceresi fiilen çalışıyor; yedek oraya.
    # Kip seçimi cron dizgesine baktığı için bu koşu da GÜNLÜK kipte açılır.
    # 01:53 koşmuşsa ikinci koşu artımlıdır (skorlanmış makale yeniden
    # skorlanmaz) ve dakikalar sürer; sayfayı gün ortası tazelemiş olur.
    - cron: '11 12 * * 1-5'   # 15:11 İstanbul — günlük kip yedeği
  workflow_dispatch:
    inputs:
      tam_kip:
        description: >-
          Tam kip: 52 haftalık GDELT arşivini de tazele (~1 saat 45 dakika).
          Kapalıysa yalnız canlı haber akışı çekilir ve anlık endeks ilerler.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fx
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    # İlk koşu 780 hafta-çekimi + tüm arşivin FinBERT'le skorlanması demek ve
    # saatler sürebilir. Sonraki koşular artımlıdır (haber önbelleği taşınır,
    # skorlama yalnız yeni makaleleri işler) — dakikalar. Sınır yüksek ama
    # sonsuz değil: takılan bir koşu haftalarca dakika yakmasın.
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}/ortak
      # Model indirmesi ilerleme çubuğu basmasın — koşu kaydı okunur kalsın.
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # FinBERT ağırlıkları (~440 MB). Önbellek olmadan her hafta yeniden
      # inerdi; koşunun en uzun adımı bu.
      - name: FinBERT model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1

      # HABER ÖNBELLEĞİ — bu adım olmadan hat ASLA tamamlanamaz.
      #
      # İlk koşu 780 hafta-çekimi yapıyor (15 varlık × 52 hafta) ve saatler
      # sürüyor. Çekilen haberler `data/gdelt_cache.json`e yazılıyor ama o
      # dosya .gitignore'da: koşu bitse de bitmese de depoya girmiyor. Yani
      # her koşu sıfırdan başlıyor, zaman aşımına uğruyor ve BİR SONRAKİ koşu
      # yine sıfırdan başlıyor — hat sonsuza kadar tamamlanamaz. Hattın
      # yalnız yerelde tazelenebilmesinin sebebi tam olarak buydu.
      #
      # restore/save AYRI kullanılıyor: save adımı if: always() ile koşuyor,
      # böylece zaman aşımına uğrayan koşunun o ana kadar topladığı haberler
      # de saklanıyor ve gelecek koşu kaldığı yerden devam ediyor.
      # Yalnız yok sayılan iki dosya önbelleklenir; depoda İZLENEN dosyalar
      # (sentiment_scores.json gibi) bilerek dışarıda, yoksa bayat bir kopya
      # depodakinin üstüne binerdi.
      - name: Haber önbelleğini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: |
            Aktarılacak Projeler/indices/data/gdelt_cache.json
            Aktarılacak Projeler/indices/data/news_cache.json
          key: fx-haber-${{ github.run_id }}
          restore-keys: fx-haber-

      # Duman sınaması bülten katmanlarını GERÇEK depo verisiyle çağırıyor;
      # o katmanlar pandas/numpy/requests kullanıyor. Bu adım ilk kurulumda
      # unutuldu ve sınama saniyesinde düştü — doğru davranış: sınama ağa
      # çıkan adımı DURDURDU (bkz. "rapor durdurmaz, sınama durdurur").
      - name: Temel bağımlılıklar
        run: pip install --quiet requests pandas numpy plotly

      - name: Duman sınaması (bülten katmanları)
        run: python bulten/duman.py

      # Kip seçimi: pazartesi cron'u ve elle "tam kip" işaretlenen koşu ağır
      # arşivi de tazeler; Salı-Cuma günlük kip yalnız canlı akışı çeker.
      # `--gunluk` GDELT'e dokunmaz, `web_cikti.py --anlik` ile de yalnız
      # anlık endeks grafiklerini çizer — haftalık paneller ve onların
      # "veri sonu" damgası olduğu gibi kalır.
      # Kip, GÜN NUMARASINDAN DEĞİL hangi cron'un ateşlediğinden okunur.
      # Pazartesi iki koşu var: 01:53 günlük (bültenden önce), 08:37 tam kip
      # (haftalık arşiv). Gün numarasına bakan bir seçim ikisini de tam kipe
      # çevirir ve 01:53'te 1 saat 45 dakikalık arşiv koşusu başlatırdı —
      # bülteni bekletmez ama o sabahki taze okumayı da getirmezdi.
      - name: Kip
        id: kip
        env:
          TETIK: ${{ github.event.schedule }}
        run: |
          if [ "${{ inputs.tam_kip }}" = "true" ] || [ "$TETIK" = "37 8 * * 1" ]; then
            BAYRAK="--tam"; AD="tam kip (GDELT arşivi dahil)"
          else
            BAYRAK="--gunluk"; AD="günlük kip (yalnız canlı haber akışı)"
          fi
          echo "bayrak=$BAYRAK" >> "$GITHUB_OUTPUT"
          echo "ad=$AD" >> "$GITHUB_OUTPUT"
          echo "Tetik: ${TETIK:-elle} · Kip: $AD"

      - name: FX hattı — ${{ steps.kip.outputs.ad }}
        id: fx
        run: python guncelle.py fx ${{ steps.kip.outputs.bayrak }} --sistem-kur

      # Zaman aşımına uğrasa bile o ana kadar toplanan haberler saklanır.
      - name: Haber önbelleğini sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            Aktarılacak Projeler/indices/data/gdelt_cache.json
            Aktarılacak Projeler/indices/data/news_cache.json
          key: fx-haber-${{ github.run_id }}

      # if: always() — tam kip düşse bile ev stili ve commit koşar; hattın
      # kısmen ilerlemiş çıktısı çöpe gitmez (bkz. veri.yml'deki aynı ders).
      - name: Ev stili
        if: always()
        run: python site/tools/plotly_stil.py --hepsi

      - name: Commit
        if: always()
        run: |
          git config --global user.name  "tto-fx"
          git config --global user.email "bot@users.noreply.github.com"
          git add "Aktarılacak Projeler/indices" site/public/projeler/fx-haber-endeksi \
                  bulten/tazeleme_durumu.json || true
          if git diff --cached --quiet; then
            echo "değişiklik yok"
          else
            git commit -m "fx: $(date -u +'%Y-%m-%d') haber endeksi (${{ steps.kip.outputs.ad }})"
            # PUSH YARIŞI KOŞUYU DÜŞÜRMEZ: pull ile push arasında başka bir
            # itme düşerse push reddedilir ve hesaplanan çıktı çöpe gider.
            for deneme in 1 2 3 4 5; do
              git pull --rebase --autostash || true
              if git push; then break; fi
              if [ "$deneme" = "5" ]; then
                echo "::error::push beş denemede de reddedildi."
                exit 1
              fi
              echo "::warning::push reddedildi (deneme $deneme) — yeniden deneniyor."
              sleep $((deneme * 5))
            done
          fi
