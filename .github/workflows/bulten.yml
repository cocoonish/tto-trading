# Günlük bülten — kural tabanlı çekirdek, bulutta.
#
# Neden bulut: bülten "güne başlarken hazır" olmalı; bu, bilgisayarın açık
# olmasına bağlı kalmamalı. Buradaki iş YORUM YAZMAZ — yalnız ölçer: hatların
# ozet.json'larını tazeler, eşikleri uygular, takvimi ve kaynak taramasını
# ekler, site/src/data/bulten/<tarih>.json yazar.
#
# Yazı katmanı ayrıdır (claude.ai bulut rutini; bkz. bulten/YAZIM.md) ve aynı
# dosyanın yorum/özet/gündem alanlarını bulten/yaz.py kapısından doldurur; bu
# iş o alanları KORUR (bkz. bulten/uret.py: yaz()) ve yazılmış bülteni ezmez
# (bulten.py kapısı). Siteye çıkış ayrı iş akışının (yayin.yml) işidir:
# derleme + sayfa sınavı + public depoya kopya.
#
# Gereken depo secret'ı: TTO_EVDS_KEY (zorunlu) — EVDS'e giden hatlar için.
# TTO_YAYIN_TOKEN bu işte değil yayin.yml'de kullanılır.

name: Günlük bülten

on:
  schedule:
    # Hafta içi ÖLÇÜM koşusu: 03:23 UTC = 06:23 İstanbul (Pzt–Cum).
    # Zincirin ortasındaki halka: veri tazeleme 05:13'te başlar (70 dk önce),
    # yazı katmanı (bulut rutini) 07:15'te (52 dk sonra). Üç halkanın arası
    # bilerek geniş; hiçbiri diğerinin bitişini beklemiyor, yalnız saate güveniyor.
    # Pay geniş tutuldu: GitHub'ın zamanlanmış işleri en iyi çaba esaslıdır ve
    # yoğun saatlerde 10–20 dakika gecikebilir (2026-08-26'da 04:00 koşusu hiç
    # başlamadı). Dar pay, ölçüm gecikince yazı katmanının boş dosya bulması
    # demek olurdu. Dakikalar yuvarlak değil: zamanlayıcı saat başı ve
    # yarımlarda sıkışıyor (bu depoda 30 dk – 2 saat gecikme görüldü).
    # Ölçüm hiç koşmazsa yazı katmanı bülteni kendisi üretir, zincir kopmaz.
    - cron: '23 3 * * 1-5'
    # YEDEK TETİKLEYİCİ — yukarıdaki 26.08 ve 27.08'de hiç başlamadı.
    # 03:51, yazı katmanının 04:15'teki başlangıcından 24 dakika önce.
    # İki koşu da düşerse yazı katmanı zinciri kendi tetikler (YAZIM.md,
    # 0. adım); geç düşen bir koşunun yazıyı ezmesine karşı da bulten.py
    # içindeki 'yazılmış bülten ezilmez' kapısı var.
    - cron: '51 3 * * 1-5'
    # Pazar "haftaya bakış" ölçümü: 14:03 UTC = 17:03 İstanbul.
    # Yazı katmanı 17:45'te başlar; bülten 18:00'da hazır olur.
    - cron: '3 14 * * 0'
    # PAZAR YEDEĞİ. Hafta içi ölçümün iki şansı vardı (03:23 ve 03:51), pazarın
    # TEK şansı — ve 30.08.2026'da o tek koşu hiç başlamadı; haftaya bakış
    # ancak elle tetiklenerek çıktı. Yedeğin olmaması, haftalık bültenin
    # tamamen yazı katmanının elle müdahalesine bağlı kalması demekti.
    # 14:29, yazı katmanının 14:45'teki başlangıcından 16 dakika önce.
    - cron: '29 14 * * 0'
  workflow_dispatch:
    inputs:
      yeniden_olc:
        description: >-
          Yazılmış bültenin ölçüsünü YENİDEN KUR. Normalde kapı buna izin
          vermez: geç düşen bir ölçüm koşusu yayımlanmış metnin altındaki
          sayıları değiştirmemelidir. Yalnız ölçümün KENDİSİ yanlış çıktığında
          açılır — ve ardından metin güncel ölçüye göre elden geçirilmelidir.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bulten
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
      # ortak/sitecustomize.py — zaman aşımısız HTTP isteğine varsayılan zaman
      # aşımı + yeniden deneme. Burada asıl muhatap piyasa.py'nin yfinance
      # çağrıları: takılan tek bir sembol 20 dakikalık iş bütçesini yiyebilir.
      PYTHONPATH: ${{ github.workspace }}/ortak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Bağımlılıklar
        # yfinance piyasa fotoğrafını (BIST, US/EU hisse, G10, XAU/XAG, petrol,
        # crack spread) besler. 2026-08-25'te listede olmadığı için o günün
        # bülteni 11 varlık grubunu ve 24 TL faiz satırını kaybetti.
        run: pip install --quiet pandas numpy scipy statsmodels plotly requests
          feedparser openpyxl xlrd yfinance urllib3

      # Anahtar yoksa iş YEŞİL bitmesin diye değil — bülten yine üretilebilir —
      # ama görünür uyarı düşsün: veriler depodaki son sürümde kalacak.
      # DUMAN SINAMASI: ağa çıkmadan, saniyeler içinde. Bu depoyu birden çok
      # oturum aynı gün düzenliyor; aralarındaki sözleşme kayması kimsenin
      # sınamadığı yerden vuruyor (26.08: _yayimlar tek listeden çifte döndü,
      # aynı gün eklenen başka bir çağrı onu tek liste sandı, veri hattı düştü).
      # Bu adım TANI DEĞİL: üretim kod yollarını sınar, düşerse koşu durmalı.
      - name: Duman sınaması (bülten katmanları)
        run: python bulten/duman.py

      - name: EVDS anahtarı var mı
        id: anahtar
        run: |
          if [ -z "${TTO_EVDS_KEY}" ]; then
            echo "::warning::TTO_EVDS_KEY tanımlı değil — hatlar tazelenemez, bülten depodaki son veriden üretilir."
            echo "var=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "var=evet" >> "$GITHUB_OUTPUT"
          fi

      # Veri tazeleme burada YAPILMAZ: ayrı bir iş akışı (veri.yml) her hattı
      # kendi yayım takviminde tazeler ve sonuncusu bültenden 45 dk önce koşar.
      # Eskiden bülten on bir hattı baştan çekiyordu; 2026-08-25'te bu 37 dakika
      # sürdü ve tek bir yeni veri getirmedi. Bülten artık yalnız ÖLÇER.
      - name: Veri tazeliği
        continue-on-error: true
        run: python bulten/tazeleme.py

      # Pazar koşusu haftalık bülten üretir ("geçen hafta / önümüzdeki hafta");
      # hafta içi koşusu günlük. Cumartesi hiç koşmaz.
      - name: Bülteni üret
        env:
          YENIDEN: ${{ inputs.yeniden_olc && '--yeniden-olc' || '' }}
        run: |
          if [ -n "$YENIDEN" ]; then
            echo "::warning::Yazılmış bültenin ölçüsü YENİDEN KURULUYOR. Metin bu ölçüye göre gözden geçirilmeli."
          fi
          if [ "$(date -u +%u)" = "7" ]; then
            python bulten.py --tur haftalik $YENIDEN
          else
            python bulten.py --tur gunluk $YENIDEN
          fi

      # Kalite denetimi bulutta BİLGİ amaçlıdır: yazı katmanı burada çalışmadığı için
      # engeller beklenir. Log'da görünmesi, sabahki yazarın neyi kapatması gerektiğini
      # önceden gösterir. Yayını bu adım DURDURMAZ.
      - name: Kalite denetimi (bilgi)
        continue-on-error: true
        run: python bulten.py --denetle

      - name: Commit
        run: |
          # --global şart: yayın adımı /tmp/yayin klonunda commit atıyor ve
          # depo içi ayar oraya taşınmıyor (2026-08-25: "empty ident name").
          git config --global user.name  "tto-bulten"
          git config --global user.email "bot@users.noreply.github.com"
          git add site/src/data/bulten bulten/gecmis bulten/onbellek site/public/projeler || true
          if git diff --cached --quiet; then
            echo "değişiklik yok"
          else
            git commit -m "bülten: $(date -u +%Y-%m-%d) (otomatik)"
            # PUSH YARIŞI KOŞUYU DÜŞÜRMEZ: pull ile push arasında başka bir
            # itme düşerse push reddedilir ve hesaplanan çıktı çöpe gider.
            for deneme in 1 2 3 4 5; do
              git pull --rebase --autostash || true
              if git push; then break; fi
              if [ "$deneme" = "5" ]; then
                echo "::error::push beş denemede de reddedildi."
                exit 1
              fi
              echo "::warning::push reddedildi (deneme $deneme) — yeniden deneniyor."
              sleep $((deneme * 5))
            done
          fi
