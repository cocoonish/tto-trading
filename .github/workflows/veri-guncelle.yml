# Zamanlanmış veri güncelleme: Python hatları koşar, üretilen grafikler
# site/public altına kopyalanır, ev stili uygulanır ve commit'lenir.
# Vercel/Pages push'u gördüğünde site kendiliğinden yeniden yayınlanır.
#
# Adımlar continue-on-error ile bağımsızdır: bir kaynağın (ör. IRFCL PDF
# formatı) bozulması diğer güncellemeleri engellemez.
# Ağır hatlar (FinBERT'li FX pipeline'ı, Hazine scraper'ı) bilinçli olarak
# cron dışıdır — yerelde koşulur, çıktıları commit'lenir; buradaki adımlar
# yalnız depodaki güncel veriden grafik tazeler.

name: Veri güncelle

on:
  schedule:
    - cron: '0 6 * * 5' # her Cuma 06:00 UTC (09:00 İstanbul)
  workflow_dispatch: {} # elle tetikleme

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    # Anahtar İŞ düzeyinde: EVDS'e giden her adım (TCMB, USDTRY, REER, Yabancı)
    # buna ihtiyaç duyar. Anahtarlar kaynak koda gömülü değildir; yerelde
    # .evds_key, CI'da bu secret kullanılır. Adım bazında vermek, env'i unutulan
    # adımı anahtarsız koşturur — bu yüzden İŞ düzeyinde kalmalı.
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıklar
        run: pip install pandas numpy scipy plotly requests pdfplumber tcmb yfinance openpyxl

      # Secret eksikse ÖNDEN ve GÜRÜLTÜLÜ düş. Aksi halde EVDS'e giden üç adım
      # tek tek RuntimeError verir, continue-on-error onları yutar ve iş akışı
      # hiçbir şey üretmeden YEŞİL biter — tam da giderilmeye çalışılan
      # "sessiz bayatlama" davranışı.
      - name: EVDS anahtarı tanımlı mı
        run: |
          if [ -z "${TTO_EVDS_KEY}" ]; then
            echo "::error::TTO_EVDS_KEY deposu secret'ı tanımlı değil. EVDS'e giden"
            echo "::error::adımlar (TCMB, USDTRY, REER, Yabancı) veri çekemez. Settings >"
            echo "::error::Secrets and variables > Actions altında tanımlayın."
            exit 1
          fi
          echo "EVDS anahtarı tanımlı (${#TTO_EVDS_KEY} karakter)."

      - name: TCMB net rezerv (EVDS + IRFCL → grafik)
        id: tcmb
        continue-on-error: true
        working-directory: Aktarılacak Projeler/TCMBNetRezerv
        run: |
          python net_rezerv.py
          python grafik.py
          cp tcmb_rezerv_grafik.html "../../site/public/projeler/tcmb-net-rezerv/grafik.html"
          python ozet_uret.py && cp ozet.json "../../site/public/projeler/tcmb-net-rezerv/"

      - name: USDTRY devalüasyon (ACT/365, altı grafik — MDX'in gömdüğü tümü)
        id: usdtry
        continue-on-error: true
        working-directory: Aktarılacak Projeler/USDTRYDeval
        run: |
          python usdtry_deval_plotly.py
          python usdtry_weekly_trends.py
          python usdtry_monthly_trends.py
          cp usdtry_deval.html          "../../site/public/projeler/usdtry-deval/usdtry_deval.html"
          cp usdtry_deval_3m.html       "../../site/public/projeler/usdtry-deval/usdtry_deval_3m.html"
          cp usdtry_deval_6m.html       "../../site/public/projeler/usdtry-deval/usdtry_deval_6m.html"
          cp usdtry_deval_seg.html      "../../site/public/projeler/usdtry-deval/usdtry_deval_seg.html"
          cp usdtry_weekly_trends.html  "../../site/public/projeler/usdtry-deval/usdtry_weekly.html"
          cp usdtry_monthly_trends.html "../../site/public/projeler/usdtry-deval/usdtry_monthly.html"
          python ozet_uret.py && cp ozet.json "../../site/public/projeler/usdtry-deval/"

      - name: FX endeksi web grafikleri (depodaki veriden)
        id: fx
        continue-on-error: true
        working-directory: Aktarılacak Projeler/indices
        run: |
          python web_cikti.py
          cp cikti/*.html "../../site/public/projeler/fx-haber-endeksi/"
          python ozet_uret.py && cp ozet.json "../../site/public/projeler/fx-haber-endeksi/"

      - name: TRY REER (EVDS → REDK sapma & regresyon panelleri)
        id: reer
        continue-on-error: true
        working-directory: Aktarılacak Projeler/TRYREER
        run: |
          python main.py
          python usdtry_reer_analysis.py
          H="../../site/public/projeler/try-reer"
          cp reer_analysis.html            "$H/reer_analysis.html"
          cp usdtry_regression_10y.html    "$H/redk_degisim_regresyon.html"
          cp usdtry_regression_5y.html     "$H/redk_degisim_regresyon_5y.html"
          cp usdtry_regression_3m.html     "$H/redk_degisim_regresyon_3m.html"
          cp usdtry_reer_analysis_10y.html "$H/redk_usdtry_analiz_10y.html"
          cp usdtry_reer_analysis_5y.html  "$H/redk_usdtry_analiz_5y.html"
          python ozet_uret.py && cp ozet.json "$H/"

      - name: Yabancı pozisyonu (EVDS → kümülatif & YTD akım grafikleri)
        id: yabanci
        continue-on-error: true
        working-directory: Aktarılacak Projeler/ForeignHoldings
        run: |
          python main.py
          H="../../site/public/projeler/yabanci-pozisyon"
          cp charts/cumulative_chart.html "$H/kumulatif.html"
          cp charts/ytd_dibs.html         "$H/ytd_dibs.html"
          cp charts/ytd_hisse.html        "$H/ytd_hisse.html"
          cp charts/ytd_toplam.html       "$H/ytd_toplam.html"
          python ozet_uret.py && cp ozet.json "$H/"

      - name: Hazine tahmin grafikleri (depodaki CSV'lerden)
        id: hazine
        continue-on-error: true
        working-directory: Aktarılacak Projeler/hazineihrac
        run: |
          python web_cikti_tahmin.py
          # web_cikti_tahmin.py sayfanın gömdüğü 13 şekilden 11'ini üretir; daha
          # önce yalnız 2'si kopyalanıyordu ve kalan 9'u cron'da boşuna bayatlıyordu.
          # (hedef_gerceklesme + vade_analizi main.py'den gelir; scraper bilinçli
          #  olarak cron dışıdır, onlar yerel koşuda tazelenir.)
          H="../../site/public/projeler/hazine-ihrac"
          for f in planlanan_ihraclar tahmin_dogrulama tahmin_aylik strateji_revizyon \
                   faiz_gelisimi fiyat_araligi ihrac_hacmi ihrac_tempo ihrac_usd \
                   talep_analizi vade_dagilimi; do
            cp "$f.html" "$H/$f.html"
          done
          python ozet_uret.py && cp ozet.json "$H/"

      - name: Ev stilini uygula
        run: python3 site/tools/plotly_stil.py --hepsi

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "veri-bot"
          git config user.email "actions@github.com"
          git add site/public/projeler/
          git diff --cached --quiet || git commit -m "veri: zamanlanmış grafik güncellemesi"
          git push

      # Commit'ten SONRA çalışır: başarılı hatların çıktısı yayına gitsin, ama
      # düşen bir hat varsa iş KIRMIZI bitsin. continue-on-error tek bir kaynağın
      # bozulmasının diğerlerini engellemesini önler; sessizce başarısız olmasını
      # değil. "Yeşil ama hiçbir şey üretmedi" bu projede kabul edilen bir sonuç
      # değil — sayfa bayat veriyi taze gibi gösterir.
      - name: Hat durumu (sessiz başarısızlığa karşı)
        run: |
          # Ilişkisel dizi (declare -A) KULLANILMAZ: bash 3.x'te yok, bu adım
          # yerelde de sınanabilsin.
          durumlar="TCMB:${{ steps.tcmb.outcome }}
          USDTRY:${{ steps.usdtry.outcome }}
          FX:${{ steps.fx.outcome }}
          REER:${{ steps.reer.outcome }}
          Yabanci:${{ steps.yabanci.outcome }}
          Hazine:${{ steps.hazine.outcome }}"
          hata=0
          echo "### Veri hattı durumu" >> "$GITHUB_STEP_SUMMARY"
          for satir in $durumlar; do
            ad="${satir%%:*}"; sonuc="${satir#*:}"
            if [ "$sonuc" = "success" ]; then
              echo "- ✅ $ad" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $ad ($sonuc)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$ad hattı başarısız ($sonuc) — bu projenin sayfası bayat kalacak."
              hata=1
            fi
          done
          exit $hata
