# Zamanlanmış veri güncelleme: Python hatları koşar, üretilen grafikler
# site/public altına kopyalanır, ev stili uygulanır ve commit'lenir.
# Vercel/Pages push'u gördüğünde site kendiliğinden yeniden yayınlanır.
#
# Adımlar continue-on-error ile bağımsızdır: bir kaynağın (ör. IRFCL PDF
# formatı) bozulması diğer güncellemeleri engellemez.
# Ağır hatlar (FinBERT'li FX pipeline'ı, Hazine scraper'ı) bilinçli olarak
# cron dışıdır — yerelde koşulur, çıktıları commit'lenir; buradaki adımlar
# yalnız depodaki güncel veriden grafik tazeler.

name: Veri güncelle

on:
  schedule:
    - cron: '0 6 * * 5' # her Cuma 06:00 UTC (09:00 İstanbul)
  workflow_dispatch: {} # elle tetikleme

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    # Anahtar İŞ düzeyinde: EVDS'e giden her adım (TCMB, USDTRY, REER, Yabancı)
    # buna ihtiyaç duyar. Anahtarlar kaynak koda gömülü değildir; yerelde
    # .evds_key, CI'da bu secret kullanılır. Adım bazında vermek, env'i unutulan
    # adımı anahtarsız koşturur — bu yüzden İŞ düzeyinde kalmalı.
    env:
      TTO_EVDS_KEY: ${{ secrets.TTO_EVDS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıklar
        run: pip install pandas numpy scipy statsmodels plotly requests pdfplumber tcmb yfinance openpyxl xlrd matplotlib

      # Secret eksikse ÖNDEN ve GÜRÜLTÜLÜ düş. Aksi halde EVDS'e giden üç adım
      # tek tek RuntimeError verir, continue-on-error onları yutar ve iş akışı
      # hiçbir şey üretmeden YEŞİL biter — tam da giderilmeye çalışılan
      # "sessiz bayatlama" davranışı.
      - name: EVDS anahtarı tanımlı mı
        run: |
          if [ -z "${TTO_EVDS_KEY}" ]; then
            echo "::error::TTO_EVDS_KEY deposu secret'ı tanımlı değil. EVDS'e giden"
            echo "::error::adımlar (TCMB, USDTRY, REER, Yabancı) veri çekemez. Settings >"
            echo "::error::Secrets and variables > Actions altında tanımlayın."
            exit 1
          fi
          echo "EVDS anahtarı tanımlı (${#TTO_EVDS_KEY} karakter)."

      # net_rezerv.py iki tanımı da üretir (piyasa tanımı + Stand-By 2A) ve
      # denetim uyarılarını uyarilar.json'a yazar; altin_etkisi.py altın fiyat
      # etkisinden arındırılmış akım tablosunu; grafik.py altı HTML'i.
      # Sıra bağlayıcıdır: sonrakiler öncekinin CSV'sini okur.
      - name: TCMB net rezerv (EVDS + IRFCL → altı grafik)
        id: tcmb
        continue-on-error: true
        working-directory: Aktarılacak Projeler/TCMBNetRezerv
        run: |
          python net_rezerv.py
          python altin_etkisi.py
          python grafik.py --no-open
          hedef="../../site/public/projeler/tcmb-net-rezerv"
          cp tcmb_rezerv_grafik.html "$hedef/grafik.html"
          cp brut_kirilim.html       "$hedef/brut_kirilim.html"
          cp altin_ayristirma.html   "$hedef/altin_ayristirma.html"
          cp akim.html               "$hedef/akim.html"
          cp swap.html               "$hedef/swap.html"
          cp tanim_farki.html        "$hedef/tanim_farki.html"
          python ozet_uret.py && cp ozet.json "$hedef/"

      - name: USDTRY devalüasyon (ACT/365, altı grafik — MDX'in gömdüğü tümü)
        id: usdtry
        continue-on-error: true
        working-directory: Aktarılacak Projeler/USDTRYDeval
        run: |
          python usdtry_deval_plotly.py
          python usdtry_weekly_trends.py
          python usdtry_monthly_trends.py
          cp usdtry_deval.html          "../../site/public/projeler/usdtry-deval/usdtry_deval.html"
          cp usdtry_deval_3m.html       "../../site/public/projeler/usdtry-deval/usdtry_deval_3m.html"
          cp usdtry_deval_6m.html       "../../site/public/projeler/usdtry-deval/usdtry_deval_6m.html"
          cp usdtry_deval_seg.html      "../../site/public/projeler/usdtry-deval/usdtry_deval_seg.html"
          cp usdtry_weekly_trends.html  "../../site/public/projeler/usdtry-deval/usdtry_weekly.html"
          cp usdtry_monthly_trends.html "../../site/public/projeler/usdtry-deval/usdtry_monthly.html"
          python ozet_uret.py && cp ozet.json "../../site/public/projeler/usdtry-deval/"

      - name: FX endeksi web grafikleri (depodaki veriden)
        id: fx
        continue-on-error: true
        working-directory: Aktarılacak Projeler/indices
        run: |
          python web_cikti.py
          cp cikti/*.html "../../site/public/projeler/fx-haber-endeksi/"
          python ozet_uret.py && cp ozet.json "../../site/public/projeler/fx-haber-endeksi/"

      - name: TRY REER (EVDS → REDK sapma & regresyon panelleri)
        id: reer
        continue-on-error: true
        working-directory: Aktarılacak Projeler/TRYREER
        run: |
          python main.py
          python usdtry_reer_analysis.py
          H="../../site/public/projeler/try-reer"
          cp reer_analysis.html            "$H/reer_analysis.html"
          cp usdtry_regression_10y.html    "$H/redk_degisim_regresyon.html"
          cp usdtry_regression_5y.html     "$H/redk_degisim_regresyon_5y.html"
          cp usdtry_regression_3m.html     "$H/redk_degisim_regresyon_3m.html"
          cp usdtry_reer_analysis_10y.html "$H/redk_usdtry_analiz_10y.html"
          cp usdtry_reer_analysis_5y.html  "$H/redk_usdtry_analiz_5y.html"
          python ozet_uret.py && cp ozet.json "$H/"

      - name: Yabancı pozisyonu (EVDS → kümülatif & YTD akım grafikleri)
        id: yabanci
        continue-on-error: true
        working-directory: Aktarılacak Projeler/ForeignHoldings
        run: |
          python main.py
          H="../../site/public/projeler/yabanci-pozisyon"
          cp charts/cumulative_chart.html "$H/kumulatif.html"
          cp charts/ytd_dibs.html         "$H/ytd_dibs.html"
          cp charts/ytd_hisse.html        "$H/ytd_hisse.html"
          cp charts/ytd_toplam.html       "$H/ytd_toplam.html"
          python ozet_uret.py && cp ozet.json "$H/"

      - name: Hazine tahmin grafikleri (depodaki CSV'lerden)
        id: hazine
        continue-on-error: true
        working-directory: Aktarılacak Projeler/hazineihrac
        run: |
          python web_cikti_tahmin.py
          python tablo_uret.py && cp tablolar.json "../../site/public/projeler/hazine-ihrac/"
          # web_cikti_tahmin.py sayfanın gömdüğü 13 şekilden 11'ini üretir; daha
          # önce yalnız 2'si kopyalanıyordu ve kalan 9'u cron'da boşuna bayatlıyordu.
          # (hedef_gerceklesme + vade_analizi main.py'den gelir; scraper bilinçli
          #  olarak cron dışıdır, onlar yerel koşuda tazelenir.)
          H="../../site/public/projeler/hazine-ihrac"
          for f in planlanan_ihraclar tahmin_dogrulama tahmin_aylik strateji_revizyon \
                   faiz_gelisimi fiyat_araligi ihrac_hacmi ihrac_tempo ihrac_usd \
                   talep_analizi vade_dagilimi; do
            cp "$f.html" "$H/$f.html"
          done
          python ozet_uret.py && cp ozet.json "$H/"

      # Enflasyon panosu: EVDS3'ten TÜFE ağacı + ÖKTG + beklenti anketleri + AOFM
      # (12 saat TTL'li önbellek). metrik.py, endeksten hesapladığı 12 aylık
      # değişimi EVDS'in kendi y/y serisiyle (formulas=3) ÇAPRAZ DOĞRULAR ve
      # 0,05 puan eşiği aşılırsa SystemExit ile düşer — yanlış sayı yayına
      # gitmesin. Ağırlıklar EVDS'te yayımlanmadığı için zincir-Laspeyres
      # kimliğinden tahmin edilir; kimlik artığı eşiği aşarsa katkı grafiği
      # üretilmez (sessizce eski ağırlıkla üretmek yasak).
      - name: Enflasyon panosu (EVDS → 3a/6a SAAR momentum, dokuz grafik)
        id: enflasyon
        continue-on-error: true
        working-directory: Aktarılacak Projeler/Enflasyon
        run: |
          python veri.py
          python metrik.py
          python grafik.py
          # Beklenen figür kümesi denetimi: grafik.py eksikte zaten çıkış 1 verir,
          # bu satır ikinci savunma — `cp cikti/*.html` var olan dosyaları kopyalayıp
          # "başarılı" bitmesin (eski grafik + taze metin = sessiz bayatlama).
          # Beklenen sayı ELLE yazılmaz: grafik.py her koşuda
          # cikti/yukseklikler.json'a ürettiği figürlerin listesini yazar.
          # Sabit sayı, bir şekil eklendiğinde cron'u yml elle güncellenene
          # kadar kırmızıya döndürürdü.
          n=$(ls cikti/*.html 2>/dev/null | wc -l | tr -d " ")
          b=$(python -c "import json;print(len(json.load(open('cikti/yukseklikler.json'))))")
          [ "$n" -eq "$b" ] || { echo "::error::Enflasyon: cikti/ içinde $n HTML var, yukseklikler.json $b figür bildiriyor — kopyalama yapılmadı."; exit 1; }
          H="../../site/public/projeler/enflasyon"
          mkdir -p "$H"
          cp cikti/*.html "$H/"
          cp uyarilar.json "$H/"
          python ozet_uret.py && cp ozet.json "$H/"

      # Kredi & parasal büyüklükler: EVDS3'ten dört frekansta çekim (12 saat TTL'li
      # önbellek). metrik.py kur etkisinden arındırılmış kredi büyümesini ZİNCİRLEME
      # kurar (önce arındır → sonra zincirle → sonra yıllıklandır; ters sıra hatayı
      # dört katına çıkarır) ve üç bağımsız doğrulamadan geçirir: (A) seviye
      # tablosundan hesaplanan HAM M1/M2/M3 büyümesi ↔ TCMB'nin ayrı ürünü olan ham
      # endeks — bu bir KİMLİK sınavıdır, 2 puanı aşarsa SystemExit ile düşer;
      # (B) arındırılmış M2 ↔ TCMB'nin ARIM2 endeksi (yöntem sınavı, eşitlik
      # beklenmez, yanlılık raporlanır); (C) haftalık ↔ aylık kredi serisi.
      # Kur girdisi ZK'ya tabi DTH'dan ima edilen sepettir; ZK tabanı 13 gün
      # gecikmeli olduğu için kuyruk tahmin edilir ve İŞARETLENİR.
      - name: Kredi & parasal büyüklükler (EVDS → arındırılmış kredi büyümesi, dokuz grafik)
        id: kredi
        continue-on-error: true
        working-directory: Aktarılacak Projeler/Kredi
        run: |
          python veri.py
          python metrik.py
          python grafik.py
          # Beklenen figür kümesi denetimi: grafik.py eksikte zaten çıkış 1 verir,
          # bu satır ikinci savunma — `cp cikti/*.html` var olan dosyaları kopyalayıp
          # "başarılı" bitmesin (eski grafik + taze metin = sessiz bayatlama).
          # Beklenen sayı ELLE yazılmaz: grafik.py her koşuda
          # cikti/yukseklikler.json'a ürettiği figürlerin listesini yazar.
          # Sabit sayı, bir şekil eklendiğinde cron'u yml elle güncellenene
          # kadar kırmızıya döndürürdü.
          n=$(ls cikti/*.html 2>/dev/null | wc -l | tr -d " ")
          b=$(python -c "import json;print(len(json.load(open('cikti/yukseklikler.json'))))")
          [ "$n" -eq "$b" ] || { echo "::error::Kredi: cikti/ içinde $n HTML var, yukseklikler.json $b figür bildiriyor — kopyalama yapılmadı."; exit 1; }
          H="../../site/public/projeler/kredi-parasal"
          mkdir -p "$H"
          cp cikti/*.html "$H/"
          cp uyarilar.json "$H/"
          python ozet_uret.py && cp ozet.json "$H/"

      # Fonlama hattı: EVDS3'ten APİ fonlama/sterilizasyon tablosu, TCMB kotasyonları
      # (koridor + GLP), TLREF, sterilizasyon ihalesi faiz/tutarları, analitik bilanço,
      # sistem likiditesi, swap stokları ve ZK tabanı (12 saat TTL'li önbellek).
      # İş günü serileri 366 günlük, haftalık seriler 900 haftalık parçalar hâlinde
      # çekilir — EVDS tek istekte 1000 satır veriyor ve gerisini aralığın SONUNDAN
      # geriye doldurup SESSİZCE kırpıyor.
      # metrik.py dört BAĞIMSIZ DOĞRULAMA yapar ve biri düşerse SystemExit ile durur:
      # (A) TP.APIFON1.TOP − TP.APIFON2.TOP = TP.APIFON3 kimliği; (B) günlük politika
      # kotasyonunun (TP.PY.P02.1H) ay sonu değeri ↔ EVDS'in AYRI yayımladığı aylık BIS
      # serisi TP.BISPOLFAIZ.TUR; (C) TLREF ↔ BİST gecelik repo AOF; (D) swap stokunun
      # rezerv hattının yerleşik swap düzeltmesiyle birebir tutması.
      # Ayrıca AOFM, fonlama tabanı 5 mlr TL'nin altına düştüğü günlerde GEÇERSİZ
      # işaretlenir (EVDS o günlerde de bir sayı basıyor — kaynak kaynaklı sessiz
      # bayatlama) ve ZK bloke hesabının 15.03.2024 öncesi tam sıfırları veri sayılmaz.
      - name: TCMB fonlama & likidite (EVDS → koridor, AOFM/AOSM, sekiz grafik)
        id: fonlama
        continue-on-error: true
        working-directory: Aktarılacak Projeler/Fonlama
        run: |
          python veri.py
          python metrik.py
          python grafik.py
          # Beklenen figür kümesi denetimi: grafik.py eksikte zaten çıkış 1 verir,
          # bu satır ikinci savunma — `cp cikti/*.html` var olan dosyaları kopyalayıp
          # "başarılı" bitmesin (eski grafik + taze metin = sessiz bayatlama).
          # Beklenen sayı ELLE yazılmaz: grafik.py her koşuda
          # cikti/yukseklikler.json'a ürettiği figürlerin listesini yazar.
          # Sabit sayı, bir şekil eklendiğinde cron'u yml elle güncellenene
          # kadar kırmızıya döndürürdü.
          n=$(ls cikti/*.html 2>/dev/null | wc -l | tr -d " ")
          b=$(python -c "import json;print(len(json.load(open('cikti/yukseklikler.json'))))")
          [ "$n" -eq "$b" ] || { echo "::error::Fonlama: cikti/ içinde $n HTML var, yukseklikler.json $b figür bildiriyor — kopyalama yapılmadı."; exit 1; }
          H="../../site/public/projeler/fonlama-likidite"
          mkdir -p "$H"
          cp cikti/*.html "$H/"
          cp uyarilar.json "$H/"
          python ozet_uret.py && cp ozet.json "$H/"

      # Marj hattı: EVDS'ten TÜFE/Yi-ÜFE (24 saat TTL'li önbellek), MEDAS ham dosyaları
      # depodadır (Playwright hasadı CI'da yok — hasat_dene başarısız olursa eski ham
      # dosyayla devam eder ve uyarı basar). Analiz dönemi veri.son_ay() ile TÜFE'nin
      # bulunduğu son aya kendiliğinden ilerler; sabit "2026-07" kalmadı.
      - name: Yiyecek hizmetleri marjı (EVDS TÜFE → 17 grafik + ozet)
        id: marj
        continue-on-error: true
        working-directory: Research/marj
        run: |
          python src/run_all.py
          python src/web_cikti.py
          python src/ozet_uret.py
          H="../../site/public/projeler/yiyecek-hizmetleri-marj"
          cp output/web/*.html "$H/"
          cp output/ozet.json "$H/"

      - name: Ev stilini uygula
        run: python3 site/tools/plotly_stil.py --hepsi

      # Sayfa ↔ hat sözleşmesi. Beş bölüm: (1) MDX'te çağrılan her <Deger>
      # anahtarı ozet.json'da var mı, (2) ozet.json'daki oynak bir sayı sayfada
      # ÇIPLAK duruyor mu (CLAUDE.md kural 5), (3) MDX yukseklik={} ↔ üretimin
      # gerçek script height'i, (4) üretim ↔ site dosya kümesi + ev stili bloğu,
      # (5) paneller alt alta mı. Kopyalamadan SONRA koşar: bir hat düştüğünde
      # bu adım da kırmızıya döner ve bayat sayfa fark edilmeden geçmez.
      - name: Sayfa sınavı (Deger anahtarları · çıplak sayı · yükseklik · panel düzeni)
        run: python3 site/tools/sayfa_sinavi.py

      # Sessiz bayatlama kilidi: eskitilmiş bir KOPYADA ozet.json'un bayat
      # bayrağını kaldırmadığı görülürse hat kırmızıya döner. Üretim dosyalarına
      # dokunmaz (geçici dizinde çalışır).
      - name: Bayatlık sınavı (Kredi · Fonlama)
        run: |
          python3 "Aktarılacak Projeler/Kredi/bayatlik_sinavi.py"
          python3 "Aktarılacak Projeler/Fonlama/bayatlik_sinavi.py"

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "veri-bot"
          git config user.email "actions@github.com"
          git add site/public/projeler/
          git diff --cached --quiet || git commit -m "veri: zamanlanmış grafik güncellemesi"
          git push

      # Commit'ten SONRA çalışır: başarılı hatların çıktısı yayına gitsin, ama
      # düşen bir hat varsa iş KIRMIZI bitsin. continue-on-error tek bir kaynağın
      # bozulmasının diğerlerini engellemesini önler; sessizce başarısız olmasını
      # değil. "Yeşil ama hiçbir şey üretmedi" bu projede kabul edilen bir sonuç
      # değil — sayfa bayat veriyi taze gibi gösterir.
      - name: Hat durumu (sessiz başarısızlığa karşı)
        run: |
          # Ilişkisel dizi (declare -A) KULLANILMAZ: bash 3.x'te yok, bu adım
          # yerelde de sınanabilsin.
          durumlar="TCMB:${{ steps.tcmb.outcome }}
          USDTRY:${{ steps.usdtry.outcome }}
          FX:${{ steps.fx.outcome }}
          REER:${{ steps.reer.outcome }}
          Yabanci:${{ steps.yabanci.outcome }}
          Hazine:${{ steps.hazine.outcome }}
          Enflasyon:${{ steps.enflasyon.outcome }}
          Kredi:${{ steps.kredi.outcome }}
          Fonlama:${{ steps.fonlama.outcome }}
          Marj:${{ steps.marj.outcome }}"
          hata=0
          echo "### Veri hattı durumu" >> "$GITHUB_STEP_SUMMARY"
          for satir in $durumlar; do
            ad="${satir%%:*}"; sonuc="${satir#*:}"
            if [ "$sonuc" = "success" ]; then
              echo "- ✅ $ad" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $ad ($sonuc)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$ad hattı başarısız ($sonuc) — bu projenin sayfası bayat kalacak."
              hata=1
            fi
          done
          exit $hata
