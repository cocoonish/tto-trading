015f\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ekredilerin para kompozisyonu EVDS'te yay\u0131mlanm\u0131yor.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eSTOK\u002fGSYH S\u00dcTUNU ise \u00dcST SINIRDIR: \u00e7\u0131pas\u0131 2026-06-30 \u00e7eyre\u011fidir ve GSYH SAB\u0130T varsay\u0131lm\u0131\u015ft\u0131r; ger\u00e7ek bir \u015fokta nominal GSYH de b\u00fcy\u00fcr.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eKaynak: TCMB EVDS3 (HMB, T\u00dc\u0130K, TCMB derlemeleri) \u00b7 bie_kbicborc, bie_ebondyazdeg, bie_dibsyazdeg, bie_brutdbborclu, bie_ebondvade, bie_gsyhhrccar.\u003c\u002fsup\u003e","x":0,"xanchor":"left","y":1.0,"yanchor":"top","yref":"container"},"font":{"family":"Georgia, serif","size":12,"color":"#1a1a1a"},"legend":{"font":{"size":11},"orientation":"h","yanchor":"top","y":-0.1,"x":0,"tracegroupgap":2,"bgcolor":"rgba(255,255,255,0)"},"margin":{"l":64,"r":64,"t":377,"b":110},"hoverlabel":{"bgcolor":"white","bordercolor":"#e8e4dc"},"height":1227,"plot_bgcolor":"white","paper_bgcolor":"white","hovermode":"x unified","barmode":"group"},                        {"responsive": true, "displaylogo": false}                    )                };            </script>        </div>
