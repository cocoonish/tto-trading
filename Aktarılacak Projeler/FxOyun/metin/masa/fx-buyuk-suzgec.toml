# 7. ders — masa katmanı: büyük mumda süzgeçler

# ─────────────────────────────────────────────── karar şeması
[[karar]]
id = "sira"
baslik = "Büyük mum kapandı: süzgeçleri hangi sırayla sorarsın"
son = "Hiçbir soru seni durdurmadıysa kalan okuma ortalamadır: 5 dakikada hafif geri verme, 1 saatte hafif devam. İkisi de maliyetin altında."
[[karar.adim]]
soru = "Takvimdeki büyük bir haberin saati mumun içine düşüyor mu?"
cikis = "evet"
sonuc = "Süzgeç okuması yok: masadan kalkarsın"
tur = "kalk"
dayanak = "7. ders, Haber mumu"
[[karar.adim]]
soru = "Dilim 1 saat mi?"
cikis = "evet"
sonuc = "Tersine girmezsin; trend ayrımına da yaslanmazsın"
tur = "yapma"
dayanak = "7. ders, 1 saat"
[[karar.adim]]
soru = "Dilim 5 dakika ve kapanış mumun en uç çeyreğinde mi?"
cikis = "evet"
sonuc = "Kovalamazsın; girmen gerekiyorsa geri çekilmeyi beklersin"
tur = "bekle"
dayanak = "7. ders, 5 dakika"
[[karar.adim]]
soru = "Dilim 5 ya da 15 dakika ve mum Asya seansında mı başladı?"
cikis = "evet"
sonuc = "5 dakikada kovalamazsın; 15 dakikada yarıya dönüş sık, yön yok"
tur = "bekle"
dayanak = "7. ders, 5 dakika; 7. ders, 15 dakika"
[[karar.adim]]
soru = "Dilim 5 dakika ve önceki 4–24 mumda başka büyük mum var mı?"
cikis = "evet"
sonuc = "Mumun yönünde kovalamazsın"
tur = "bekle"
dayanak = "7. ders, 5 dakika"
[[karar.adim]]
soru = "Okuman yalnız büyüklüğe ya da günlük oynaklığa mı dayanıyor?"
cikis = "evet"
sonuc = "Okuma yok: bu süzgeçler iki dönemde ayırmıyor"
tur = "yapma"
dayanak = "7. ders, Kısaca; 7. ders, 5 dakika"

