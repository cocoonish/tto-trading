# ─────────────────────────────────────────────── kartlar
[[kart]]
id = "guclu-mum"
hukum = "eksi"
durum = "Londra açılışı (Londra 08:00, TSİ İngiltere yaz saatinde 10:00, kış saatinde 11:00): ilk mum güçlü"
gorursun = "Tipik boyundan belirgin uzun, gövdesi mumu dolduran ve ucuna yakın kapanan bir mum; ekran 'yön belli oldu' der."
yaparsin = "İki ucu ve yarıyı günün ilk referansları olarak işaretlersin; yarıya dönüşün biraz zaman aldığını bilirsin."
yapmazsin = "Kapanışta piyasa emriyle kovalamazsın; yarıya gelince 'ucuzladı' diye katılmazsın; uzadı diye tersine girmezsin."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen limit yarıya, stop öbür ucun biraz ötesine; limit dolarsa fiyatın geri geldiği günlerdesin ve sonrası yazı turadır. Bir saatte dolmazsa çekersin."
dayanak = "2. ders, Güçlü ilk mum; 2. ders, Bu okumaları işleme çevirmek; 8. ders, Limit neden ucuz görünür: ters seçim"

[[kart]]
id = "reddedilen-mum"
hukum = "eksi"
durum = "New York açılışı (New York 09:30, TSİ ABD yaz saatinde 16:30, kış saatinde 17:30): ilk mum reddedilen"
gorursun = "Küçük gövde, bir yanda uzun fitil: fiyat bir yöne gitmiş, karşı tarafı bulmuş ve geri itilmiş."
yaparsin = "Fitilin ucunu, öbür ucu ve yarıyı işaretlersin; fitilin ucunu duvar değil referans sayarsın."
yapmazsin = "'Orada satıcı var' diye reddin yönüne, fitile yakın diye tersine girmezsin: iki yol hemen hemen eşit sıklıkta."
emir = "Başka bir gerekçeyle reddin yönünde gireceksen limit yarıya, stop fitilin ucunun ötesine; fitilin ucu kırılırsa okuma biter ve stop seni zaten dışarı alır."
dayanak = "2. ders, Normal ve reddedilen ilk mum; 1. ders, Şans ne verirdi: yolun aynası"

[[kart]]
id = "kucuk-mum"
hukum = "eksi"
durum = "Tokyo açılışı (Tokyo 09:00, TSİ 03:00, yaz ve kış aynı): ilk mum küçük"
gorursun = "Tipik boyundan belirgin kısa, iki ucu birbirine yakın bir mum; sonra uçlardan biri kırılır."
yaparsin = "İki ucu işaretler, hangisinin önce kırıldığını not edersin; kırılımı bir sinyal saymazsın."
yapmazsin = "Kırılan uca stop emriyle atlamazsın; 'sıkışma patlar' diye iki uca birden emir bırakmazsın; stopu mumun içine çekmezsin."
emir = "Başka bir gerekçeyle kırılım yönünde gireceksen stop emri kayma öder, stop öbür ucun hemen ötesinde birkaç pip uzaktadır ve makas bu riskin büyük bir parçasıdır; daha yakın stop maliyeti R cinsinden büyütür."
dayanak = "2. ders, Küçük ilk mum; 8. ders, Ucun kırılması; 8. ders, Stop uzaklığı ve maliyet"

[[kart]]
id = "trend-guclu"
hukum = "eksi"
durum = "Günlük trend yukarıyken Londra ya da New York açılışında yukarı yönlü güçlü ilk mum"
gorursun = "Günlerdir yükselen bir grafikte açılış da yukarı ve güçlü: iki işaret aynı yönü gösteriyor gibi."
yaparsin = "Trendi okuma bilgisi olarak not eder, uçları ve yarıyı trend yokmuş gibi işaretlersin."
yapmazsin = "Trend yönünde diye kovalamaz, stopu daraltmaz, hedefi uzatmazsın; trende karşı mumu da 'zayıf' saymazsın."
emir = "Emir, stop ve hedef trend yokmuş gibi kurulur: trend devam ve dönüş sıklığını değiştirmedi."
dayanak = "2. ders, Trend bir şey değiştiriyor mu; 1. ders, Trend"

