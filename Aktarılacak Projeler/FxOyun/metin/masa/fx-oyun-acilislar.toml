# ─────────────────────────────────────────────── karar şeması
[[karar]]
id = "acilis-akis"
baslik = "Açılış mumu kapanırken: masada sırayla beş soru"
son = "Kalan normal mumda fiyat birkaç dakikada yarıya döner; bu şeklin sonucudur. Uçları işaretle, işlem açmadan izle."
[[karar.adim]]
soru = "New York açılışı ve bugün bir ABD verisi günü mü?"
cikis = "evet"
sonuc = "Önce veri anını oku; o gün ayrı ölçülmedi"
tur = "bekle"
dayanak = "4. ders, ABD verileri"
[[karar.adim]]
soru = "İlk 15 dakikalık mum henüz kapanmadı mı?"
cikis = "evet"
sonuc = "Bekle: aralık daha çizilmedi"
tur = "bekle"
dayanak = "1. ders, İlk mumun dört sınıfı"
[[karar.adim]]
soru = "Mum güçlü mü: uzun ve ucuna yakın kapanmış mı?"
cikis = "evet"
sonuc = "Kovalama; iki ucu ve yarıyı işaretle"
tur = "yapma"
dayanak = "2. ders, Güçlü ilk mum"
[[karar.adim]]
soru = "Mum reddedilen mi: küçük gövde, tek yanda uzun fitil?"
cikis = "evet"
sonuc = "Fitile yön yükleme; uçları işaretle"
tur = "yapma"
dayanak = "2. ders, Normal ve reddedilen ilk mum"
[[karar.adim]]
soru = "Mum küçük mü ve uçlardan biri kırıldı mı?"
cikis = "evet"
sonuc = "Kırılımı sinyal sayma; masadan kalk"
tur = "kalk"
dayanak = "2. ders, Küçük ilk mum"

