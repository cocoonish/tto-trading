[[karar]]
id = "emir-akis"
baslik = "Büyük mumdan sonra emir: masada beş soru"
son = "Kalan durumda emir bir maliyet seçimidir: stop girişten 2 ATR; limit girişte makas ödemez, ama yalnız fiyat aleyhine yürüdüğünde dolar."
[[karar.adim]]
soru = "Emrin bekleme süresine takvimdeki büyük bir haberin penceresi düşüyor mu?"
cikis = "evet"
sonuc = "Emri açıklamadan önce çekersin (disiplin kuralı; ölçülmedi)"
tur = "kalk"
dayanak = "8. ders, Emri nereye koyarsın"
[[karar.adim]]
soru = "Girişin tek gerekçesi büyük mumun kendisi mi?"
cikis = "evet"
sonuc = "Emir vermezsin: giriş biçimi kenar yaratmaz"
tur = "kalk"
dayanak = "8. ders, 5 dakika"
[[karar.adim]]
soru = "Dilim 5 dakika ve stop girişten 1 ATR mi?"
cikis = "evet"
sonuc = "Stopu 2 ATR'ye koyarsın ya da bir üst dilimde kurarsın"
tur = "bekle"
dayanak = "8. ders, Stop uzaklığı ve maliyet"
[[karar.adim]]
soru = "Mumun yönünde, kapanışta piyasa emri mi düşünüyorsun?"
cikis = "evet"
sonuc = "Kovalamazsın: limit çeyrek ya da yarı geri çekilmeye, dolum bir uyarı"
tur = "bekle"
dayanak = "8. ders, Limit neden ucuz görünür: ters seçim"
[[karar.adim]]
soru = "Dilim 1 saat ve mumun tersine mi gireceksin?"
cikis = "evet"
sonuc = "Tersine girmezsin"
tur = "yapma"
dayanak = "8. ders, 15 dakika ve 1 saat"

# ─────────────────────────────────────────────────────────────── kartlar

[[kart]]
id = "bes-dk-kapanis"
hukum = "eksi"
durum = "5 dakikalık grafikte, takvimde haber olmayan bir saatte, ucunda kapanan büyük mumdan hemen sonra mumun yönünde girmeyi düşünüyorsun."
gorursun = "Mum kapandı, fiyat hâlâ ucun yakınında ve sonraki mumun açılışı kapanışa yapışık: kaçmakta olan bir hareket."
yaparsin = "Mumun iki ucunu ve yarısını işaretlersin; kapanışta piyasa emrinin ödeyeceği makası ve kaymayı stopun pip uzaklığının yanına yazarsın."
yapmazsin = "Kapanışta piyasa emriyle ya da uca stop emriyle kovalamazsın: 5 dakikada ikisi de maliyeti girişte ve çıkışta öder, maliyetten önce de sıfır çevresindedir. Tersine kapanışta piyasa girişinin maliyetten önceki küçük artısını da kenar saymazsın; maliyetten sonra o da eksidir."
emir = "Başka bir gerekçen varsa emir limittir: mumun çeyrek ya da yarı geri çekilmesine; stop limitin fiyatından 2 ATR, hedef 1 R. Emir altı mum bekler, dolmazsa iptal edilir; fiyat yeni bir uç yaparsa limiti peşinden taşımazsın. Süresine haber penceresi düşüyorsa emri açıklamadan önce çekersin."
dayanak = "8. ders, 5 dakika; 8. ders, Limit neden ucuz görünür: ters seçim; 8. ders, Emri nereye koyarsın"

[[kart]]
id = "saat-tersine"
hukum = "eksi"
durum = "1 saatlik grafikte büyük bir mum kapandı ve hareket sana aşırı uzamış görünüyor."
gorursun = "Mum önceki mumların birkaç katı, kapanış uca yakın; günlük grafikte de göze batıyor ve dönmesi gerekiyormuş gibi duruyor."
yaparsin = "Mumun uçlarını ve yarısını işaretler, bir günlük izleme penceresi boyunca fiyatın mumun yönünde kalıp kalmadığına bakarsın."
yapmazsin = "Mumun tersine girmezsin: stop 2 ATR ve hedef 1 R ile 1 saatte tersine girişlerin hepsi 2018–2023'te maliyetten önce de eksiydi, uca ya da ucun yarım ATR ötesine konan tersine limit dahil; 2024 sonrasında maliyetten önce sıfırın çevresinde kaldılar, maliyetten sonra hepsi eksi."
emir = "Mumun yönünde başka bir gerekçen varsa limit çeyrek ya da yarı geri çekilmeye; stop limitin fiyatından 2 ATR. Onay mumu 2018–2023'te en az kaybeden biçimdi, 2024 sonrasında mumun yönündeki biçimlerin en çok kaybedeni oldu; onu güvenli seçenek saymazsın. Hedefi 2 R'ye taşımanın sonucu sıfırdan ayırt edilemiyor; bunu bir kenar saymazsın."
dayanak = "8. ders, 15 dakika ve 1 saat; 6. ders, Dilim dilim okuma"

[[kart]]
id = "yariya-limit"
hukum = "eksi"
durum = "Büyük mumdan sonra mumun yönünde, mumun yarısına bir limit koydun ve emir doldu."
gorursun = "Fiyat hareketin yarısını geri aldı; dolum ekranda ucuz bir fiyat gibi görünür."
yaparsin = "Dolumu bir uyarı sayarsın: limit, aynı anda piyasadan girilen işlemin çoğunlukla kaybettiği olaylarda dolar. Stopu ve hedefi baştan yazdığın yerde bırakırsın."
yapmazsin = "Dolumu iyi haber saymazsın, yüksek dolum oranını limitin seçici olduğuna yormazsın, ucuz göründü diye stopu uzaklaştırmazsın."
emir = "Limit mumun yarısında; stop limitin fiyatından 2 ATR, hedef 1 R. Emir altı mum bekler, dolmazsa iptal edilir ve kovalanmaz. Süresine takvimdeki büyük bir haberin penceresi düşüyorsa emri açıklamadan önce çekersin."
dayanak = "8. ders, Limit neden ucuz görünür: ters seçim; 8. ders, Emri nereye koyarsın"

[[kart]]
id = "stop-1atr"
hukum = "eksi"
durum = "5 dakikalık grafikte büyük mumdan sonra stopu girişten bir ATR'ye koymayı düşünüyorsun."
gorursun = "Yarıdan giriyorsan bu stop mumun öbür ucuna yakın düşer ve grafikte makul görünür; pip olarak ise birkaç piptir ve tek bir makas onun görünür bir parçasıdır."
yaparsin = "Riski pip olarak yazar, makasla ve kaymayla yan yana koyarsın. Bu derste risk belirli bir pip sınırının altındaysa işlem hiç açılmadı; masada da aynı sınırı sorarsın."
yapmazsin = "Stopu yaklaştırarak kaybı küçülttüğünü düşünmezsin: pip olarak küçülen kayıp, R cinsinden büyüyen maliyetle gelir ve kenar değişmez. Stopu mumun öbür ucunun ötesine koymayı da bir çözüm saymazsın; o yer bu seride ölçülmedi ve büyük mumların çoğunda yarıdan bir ile bir buçuk ATR uzaktadır."
emir = "Başka bir gerekçeyle gireceksen stopu girişten 2 ATR'ye koyarsın ya da fikri bir üst dilimde kurarsın. Aynı pip kaybını korumak için pozisyonu küçültmek bu derste ölçülmedi."
dayanak = "8. ders, Stop uzaklığı ve maliyet; 8. ders, Emri nereye koyarsın"

[[kart]]
id = "onay"
hukum = "eksi"
durum = "Büyük mumdan sonra bir mum daha görmek için onay bekliyorsun."
gorursun = "Sonraki mum büyük mumun kapanışının ötesinde kapanır ya da kapanmaz; kapanırsa fiyat bir mum daha yürümüştür."
yaparsin = "Onay gelirse girişin daha ileriden olacağını ve stopun da o kadar taşınacağını hesaba katarsın; gelmezse işlem yoktur ve bunu kayıp saymazsın."
yapmazsin = "Onay mumunu bir kenar saymazsın: 5 dakikada onaylı girişin maliyetten önceki sonucu kapanıştaki piyasa girişinden belirgin farklı değil, 1 saatte 2018–2023'teki en az kaybeden sırası 2024 sonrasında korunmadı. Onay gelmedi diye mumun tersine de girmezsin; tersine onaylı giriş de maliyetten sonra eksi."
emir = "Onaylı giriş onay mumunun kapanışında piyasa emridir; stop girişten 2 ATR, hedef 1 R. Onay gelmediği olayda emir yoktur, bekleyen bir emir de bırakılmaz."
dayanak = "8. ders, Onay mumu; 8. ders, 15 dakika ve 1 saat"

[[kart]]
id = "uc-stop"
hukum = "eksi"
durum = "Büyük mumun ucunun ötesine, fiyat yeni bir uç yaparsa girmek için stop emri koymayı düşünüyorsun."
gorursun = "Fiyat ucun yanında dolaşıyor; uç kırıldığı an hareket hızlanıyormuş gibi görünür."
yaparsin = "Emrin dolacağı yerin kayma ödeyeceği yer olduğunu bilir, giriş fiyatını kapanışla değil ucun ötesiyle yazarsın."
yapmazsin = "Ucun kırılmasını momentumun kanıtı saymazsın: 5 dakikada uca stop emri maliyetten önce sıfır çevresinde, maliyetten sonra eksi. Bekleme süresinde dolmayan emrin ardından fiyatı kovalamazsın."
emir = "Emir ucun bir fiyat adımı ötesinde; stop girişten 2 ATR, hedef 1 R; altı mum bekler, dolmazsa iptal edilir. Süresine takvimdeki büyük bir haberin penceresi düşüyorsa emri açıklamadan önce çekersin."
dayanak = "8. ders, Ucun kırılması; 8. ders, Emri nereye koyarsın"

