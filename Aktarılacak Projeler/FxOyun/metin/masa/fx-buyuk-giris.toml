[[karar]]
id = "emir-akis"
baslik = "Büyük mumdan sonra emir: masada beş soru"
son = "Kalan durumda emir bir maliyet seçimidir: limit girişte makas ödemez, ama yalnız fiyat aleyhine yürüdüğünde dolar."
[[karar.adim]]
soru = "Takvimde büyük bir haber emrin bekleme süresine düşüyor mu?"
cikis = "evet"
sonuc = "Emir yok: haber mumunda okuma yok"
tur = "kalk"
dayanak = "9. ders, Büyük mum için oyun planı"
[[karar.adim]]
soru = "Girişin tek gerekçesi büyük mumun kendisi mi?"
cikis = "evet"
sonuc = "Emir yok: giriş biçimi kenar yaratmaz"
tur = "kalk"
dayanak = "8. ders, 5 dakika"
[[karar.adim]]
soru = "Dilim 5 dakika ve stop girişten 1 ATR mi?"
cikis = "evet"
sonuc = "Stop 2 ATR ya da bir üst dilim"
tur = "bekle"
dayanak = "8. ders, Stop uzaklığı ve maliyet"
[[karar.adim]]
soru = "Mumun yönünde, kapanışta piyasa emri mi düşünüyorsun?"
cikis = "evet"
sonuc = "Kapanışta girilmez: limit yarıya ya da hiç"
tur = "bekle"
dayanak = "8. ders, Limit neden ucuz görünür"
[[karar.adim]]
soru = "Dilim 1 saat ve mumun tersine mi gireceksin?"
cikis = "evet"
sonuc = "Tersine girilmez"
tur = "yapma"
dayanak = "8. ders, 15 dakika ve 1 saat"

# ─────────────────────────────────────────────────────────────── kartlar

[[kart]]
id = "bes-dk-kapanis"
durum = "5 dakikalık grafikte, takvimde haber olmayan bir saatte, ucunda kapanan büyük mumdan hemen sonra mumun yönünde girmeyi düşünüyorsun."
gorursun = "Mum kapandı, fiyat hâlâ ucun yakınında ve sonraki mumun açılışı kapanışa yapışık: kaçmakta olan bir hareket."
yaparsin = "Mumun iki ucunu ve yarısını işaretlersin; kapanışta piyasa emrinin ödeyeceği makası ve kaymayı stopun pip uzaklığının yanına yazarsın."
yapmazsin = "Kapanışta piyasa emriyle ya da uca stop emriyle kovalamazsın: 5 dakikada ikisi de maliyeti girişte ve çıkışta öder, maliyetten önce de sıfır çevresindedir."
emir = "Başka bir gerekçen varsa emir limittir (mumun çeyreği ya da yarısı); stop girişten 2 ATR, hedef 1 R. Fiyat yeni bir uç yaparsa limiti peşinden taşımazsın; bekleme süresi dolunca iptal edersin."
dayanak = "8. ders, 5 dakika; 8. ders, Limit neden ucuz görünür"

[[kart]]
id = "saat-tersine"
durum = "1 saatlik grafikte büyük bir mum kapandı ve hareket sana aşırı uzamış görünüyor."
gorursun = "Mum önceki mumların birkaç katı, kapanış uca yakın; günlük grafikte de göze batıyor ve dönmesi gerekiyormuş gibi duruyor."
yaparsin = "Mumun uçlarını ve yarısını işaretler, bir günlük izleme penceresi boyunca fiyatın mumun yönünde kalıp kalmadığına bakarsın."
yapmazsin = "Mumun tersine girmezsin: 2018–2023'te 1 saatte tersine girişlerin hepsi maliyetten önce de eksiydi; uca ya da ucun yarım ATR ötesine konan tersine limit dahil."
emir = "Mumun yönünde başka bir gerekçen varsa geri çekilmeye limit (çeyrek ya da yarı) ya da onay mumundan sonra piyasa; stop girişten 2 ATR. Hedefi 2 R'ye taşımanın sonucu burada sıfırdan ayırt edilemiyor; bunu bir kenar saymazsın."
dayanak = "8. ders, 15 dakika ve 1 saat; 6. ders, Dilim dilim okuma"

[[kart]]
id = "yariya-limit"
durum = "Büyük mumdan sonra mumun yönünde, mumun yarısına bir limit koydun ve emir doldu."
gorursun = "Fiyat hareketin yarısını geri aldı; dolum mumu çoğu zaman mumun tersine kapanmış bir mumdur ve ekranda ucuz bir fiyat gibi görünür."
yaparsin = "Dolumu bir uyarı sayarsın: limit, aynı anda piyasadan girilen işlemin çoğunlukla kaybettiği olaylarda dolar. Stopu ve hedefi baştan yazdığın yerde bırakırsın."
yapmazsin = "Dolumu iyi haber saymazsın, yüksek dolum oranını limitin seçici olduğuna yormazsın, ucuz göründü diye stopu uzaklaştırmazsın."
emir = "Limit mumun yarısında; stop limitin 2 ATR ötesinde, hedef 1 R. Emir sınırlı sayıda mum bekler, dolmazsa iptal edilir ve kovalanmaz. Bekleme süresine takvimde büyük bir haber düşüyorsa emri bekletmezsin."
dayanak = "8. ders, Limit neden ucuz görünür; 9. ders, Büyük mum için oyun planı"

[[kart]]
id = "stop-1atr"
durum = "5 dakikalık grafikte büyük mumdan sonra stopu girişten bir ATR'ye, mumun ucunun hemen ötesine koymayı düşünüyorsun."
gorursun = "Stop grafikte makul görünür, çünkü mumun ucuna yakındır; pip olarak ise birkaç piptir ve tek bir makas onun görünür bir parçasıdır."
yaparsin = "Riski pip olarak yazar, makasla ve kaymayla yan yana koyarsın. Bu derste risk belirli bir pip sınırının altındaysa işlem hiç açılmadı; masada da aynı sınırı sorarsın."
yapmazsin = "Stopu yaklaştırarak kaybı küçülttüğünü düşünmezsin: pip olarak küçülen kayıp, R cinsinden büyüyen maliyetle gelir ve kenar değişmez."
emir = "Başka bir gerekçeyle gireceksen stopu girişten 2 ATR'ye koyarsın ya da fikri bir üst dilimde kurarsın. Aynı pip kaybını korumak için pozisyonu küçültmek bu derste ölçülmedi."
dayanak = "8. ders, Stop uzaklığı ve maliyet"

[[kart]]
id = "onay"
durum = "Büyük mumdan sonra bir mum daha görmek için onay bekliyorsun."
gorursun = "Sonraki mum büyük mumun kapanışının ötesinde kapanır ya da kapanmaz; kapanırsa fiyat bir mum daha yürümüştür."
yaparsin = "Onay gelirse girişin daha ileriden olacağını ve stopun da o kadar taşınacağını hesaba katarsın; gelmezse işlem yoktur ve bunu kayıp saymazsın."
yapmazsin = "Onay mumunu bir kenar saymazsın: 5 dakikada onaylı girişin maliyetten önceki sonucu kapanıştaki piyasa girişinden belirgin farklı değil. Onay gelmedi diye mumun tersine de girmezsin; tersine onaylı giriş de maliyetten sonra eksi."
emir = "Onaylı giriş onay mumunun kapanışında piyasa emridir; stop girişten 2 ATR, hedef 1 R. Onay gelmediği olayda emir yoktur, bekleyen bir emir de bırakılmaz."
dayanak = "8. ders, Onay mumu"

[[kart]]
id = "uc-stop"
durum = "Büyük mumun ucunun ötesine, fiyat yeni bir uç yaparsa girmek için stop emri koymayı düşünüyorsun."
gorursun = "Fiyat ucun yanında dolaşıyor; uç kırıldığı an hareket hızlanıyormuş gibi görünür."
yaparsin = "Emrin dolacağı yerin kayma ödeyeceği yer olduğunu bilir, giriş fiyatını kapanışla değil ucun ötesiyle yazarsın."
yapmazsin = "Ucun kırılmasını momentumun kanıtı saymazsın: 5 dakikada uca stop emri maliyetten önce sıfır çevresinde, maliyetten sonra eksi. Bekleme süresinde dolmayan emrin ardından fiyatı kovalamazsın."
emir = "Emir ucun bir fiyat adımı ötesinde; stop girişten 2 ATR, hedef 1 R; sınırlı sayıda mum bekler, dolmazsa iptal edilir. Bekleme süresine takvimde büyük bir haber düşüyorsa emri açık bırakmazsın."
dayanak = "8. ders, Ucun kırılması; 9. ders, Büyük mum için oyun planı"

