# ─────────────────────────────────────────────────────────────── senaryo kartları

[[kart]]
id = "haber-oncesi"
durum = "Açıklamaya on dakika kala, ABD verisinden ya da bir merkez bankası kararından önce, açık bir emirle ya da pozisyonla masadasın"
gorursun = "Mumlar küçülmüş, aralık birkaç dakikadır dar; takvimde saati belli bir açıklama var ve fiyat onu bekliyor."
yaparsin = "Defterdeki emirleri gözden geçirirsin; açık pozisyonun stopunun, ilk mumun tipik boyu kadar bir hareketin içinde kalıp kalmadığına bakarsın; açıklamanın saatini TSİ olarak not edersin."
yapmazsin = "Açıklamadan saniyeler önce yön tahminiyle girmezsin; dar aralığın hemen dışına, haberi yakalamak için stop emri bırakmazsın."
emir = "Bıraktığın stop emri haber mumunda seviyesinin ötesinde dolabilir (sınamadaki ek kayma bir varsayımdı, gerçek kayma ölçülmedi). Yeni bir işlemin emrini ilk mum kapanmadan koymazsın."
dayanak = "1. ders, Kazanma oranı ile net sonuç; 1. ders, İlk mumun dört sınıfı; 8. ders, Stop uzaklığı ve maliyet"

[[kart]]
id = "veri-normal"
durum = "5 dakikalık grafikte, tarım dışı istihdam ya da TÜFE açıklamasından sonra normal ya da reddedilen ilk mum"
gorursun = "Boyu tipik boya yakın bir mum; kapanışı ucunda değil, ortasına yakın. Reddedilen mumda bir yönde uzun bir fitil ve küçük bir gövde."
yaparsin = "Mumun iki ucunu ve yarısını işaretlersin; sonraki iki saatte fiyatın yarıya ve öbür uca gidip gitmediğine bakarsın."
yapmazsin = "Mumun yönünde kalmazsın: bu itiş iki dönemde de şanstan seyrek sürdü. Mumun tersine de girmezsin: o tepki önceden yazılmadı ve sınanmadı."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen limit mumun yarısına, stop öbür ucun ötesine; limit dolarsa itişin yarıya kadar geri alındığını bilirsin. Limit izlemenin ilk saatinde dolmazsa emri çekersin."
dayanak = "4. ders, ABD verileri; 5. ders, Referans tepkiler; 8. ders, Limit neden ucuz görünür: ters seçim"

[[kart]]
id = "karar-guclu"
durum = "5 dakikalık grafikte, Fed, ECB ya da BoE kararından sonra güçlü ya da reddedilen ilk mum"
gorursun = "Güçlüde tipik boyun belirgin üstünde, ucuna yakın kapanan bir mum; reddedilende bir yönde uzun fitil, küçük gövde. Basın toplantısı henüz başlamamış."
yaparsin = "Mumun yönünü ve iki ucunu işaretlersin; basın toplantısı boyunca fiyatın mumun öbür ucuna gidip gitmediğine bakarsın; sonucu izlenecek bir aday olarak kaydedersin."
yapmazsin = "Birkaç karar gününden gelen artı sonucu bir kural saymazsın; basın toplantısının karar mumunun yönünde gideceğini varsaymazsın."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen stop mumun öbür ucunun ötesine gider ve pip cinsinden geniştir; hedef yakınsa başa baş için gereken kazanma oranı da yükselir. Basın toplantısı öbür ucu kırarsa okuma biter."
dayanak = "4. ders, Merkez bankası kararları; 5. ders, İşlem tepkileri; 1. ders, Kazanma oranı ile net sonuç"

[[kart]]
id = "karar-kucuk"
durum = "5 dakikalık grafikte, Fed, ECB ya da BoE kararından sonra küçük ilk mum (karar metni fiyatı oynatmadı)"
gorursun = "Tipik boyun çok altında bir mum; fiyat birkaç mumdur karar mumunun aralığında dolaşıyor, basın toplantısı henüz başlamadı."
yaparsin = "Mumun iki ucunu işaretlersin; basın toplantısının saatini not edersin (Fed TSİ 21:30, ABD kış saatinde 22:30; ECB TSİ 15:45, Avrupa kış saatinde 16:45); hangi ucun önce kırıldığına bakarsın."
yapmazsin = "Küçük mumu kararın etkisiz kaldığı diye okumazsın; ilk kırılımdan önce bir taraf seçmezsin."
emir = "Kırılan uçtan gireceksen stop öbür ucun ötesine, hedef bir R; küçük mum küçük risk demektir ve makas ile kayma o riskin büyük bir parçası olur."
dayanak = "4. ders, Küçük haber mumu; 5. ders, Maliyet nereye gidiyor; 8. ders, Stop uzaklığı ve maliyet"

[[kart]]
id = "iki-saat"
durum = "Açıklamadan iki saat sonra: ilk mumdan sonraki izleme penceresi doldu"
gorursun = "Fiyat ilk mumun aralığına dönmüş ya da ondan uzaklaşmış; ABD verisinde bu sürenin içinde New York açılışı da geçmiş."
yaparsin = "Haber okumasını kapatırsın; bundan sonrasına günün öbür anlarının okumasıyla bakarsın."
yapmazsin = "İki saat sonra hâlâ ilk mumun yönünü bir gerekçe saymazsın: bu dersin ölçüsü o pencerenin ötesine gitmez."
emir = "Haberle açılmış bir emir hâlâ defterdeyse çekersin; sınanan tepkilerde ne hedefe ne stopa ulaşan pozisyon pencerenin sonunda kapandı."
dayanak = "1. ders, İncelenen on an; 4. ders, Bu okumaları işleme çevirmek"


