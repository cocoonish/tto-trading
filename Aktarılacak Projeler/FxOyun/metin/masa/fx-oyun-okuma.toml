# 1. ders (fx-oyun-okuma) — masa katmanı: ilk mumu masada okumak

# ─────────────────────────────────────────────────────────────── karar şeması
[[karar]]
id = "ilk-mum"
baslik = "Anın ilk mumu kapandı: masada beş soru"
son = "Geriye ABD verisi kalır: ilk mumun yönü şanstan seyrek sürdü. Bu bir okumadır, sınanmış bir tepki değil."
[[karar.adim]]
soru = "İlk mum henüz kapanmadı mı?"
cikis = "evet"
sonuc = "Bekle: sınıf ancak kapanışta belli olur"
tur = "bekle"
dayanak = "1. ders, İlk mumun dört sınıfı"
[[karar.adim]]
soru = "An bir merkez bankası kararı mı?"
cikis = "evet"
sonuc = "Olay az, hüküm yok: okuma kurmadan kalk"
tur = "kalk"
dayanak = "4. ders, Merkez bankası kararları"
[[karar.adim]]
soru = "An bir açılış mı?"
cikis = "evet"
sonuc = "Yön okuma; iki ucu ve yarıyı işaretle"
tur = "yapma"
dayanak = "1. ders, Şans ne verirdi: yolun aynası; 2. ders, Sınıf sınıf, şansın payıyla"
[[karar.adim]]
soru = "İlk mum küçük mü?"
cikis = "evet"
sonuc = "Kırılım sinyal değil: kırılan tarafı izle"
tur = "bekle"
dayanak = "3. ders, Sessiz fiksing; 4. ders, Küçük haber mumu"
[[karar.adim]]
soru = "An bir fiksing mi?"
cikis = "evet"
sonuc = "Geri verme beklenir; koşuyu kovalama"
tur = "yapma"
dayanak = "3. ders, Sınıf sınıf, şansın payıyla"

