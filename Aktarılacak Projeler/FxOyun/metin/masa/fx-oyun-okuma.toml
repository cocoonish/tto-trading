# ─────────────────────────────────────────────────────────────── kartlar
[[kart]]
id = "reddedilen-acilis"
hukum = "eksi"
durum = "15 dakikalık grafikte, Londra açılışında (Londra 08:00; TSİ İngiltere yaz saatinde 10:00, kış saatinde 11:00) uzun fitilli, küçük gövdeli bir ilk mum"
gorursun = "Fiyat bir yöne gitmiş ve geri itilmiş; fitillerden biri mumun yarısından uzun."
yaparsin = "Mumu kapanışta sınıflandırır, iki ucu ve yarıyı işaretlersin; fitilin ucunu günün referansı olarak not edersin."
yapmazsin = "Fitili 'orada satıcı var' diye bir yön işareti saymazsın; reddin yönünde de tersine de yalnız bu mum yüzünden girmezsin."
emir = "Başka bir gerekçeyle reddin yönünde gireceksen limit yarıya, stop fitilin ucunun biraz ötesine; limit izlenen süre içinde dolmazsa çekilir."
dayanak = "2. ders, Normal ve reddedilen ilk mum; 1. ders, Kazanma oranı ile net sonuç"

[[kart]]
id = "guclu-acilis"
hukum = "eksi"
durum = "15 dakikalık grafikte, Londra açılışında (Londra 08:00; TSİ İngiltere yaz saatinde 10:00, kış saatinde 11:00) ucunda kapanan güçlü bir ilk mum"
gorursun = "Gövdesi mumu dolduran, ucunda kapanan büyük bir mum; sonraki mumlarda fiyat çoğu zaman bir süre aynı yöne gider."
yaparsin = "İki ucu, yarıyı ve devam eşiğini işaretlersin; iki eşiğin kapanışa uzaklığına bakarsın."
yapmazsin = "Devamı yön bilgisi saymazsın: yönsüz bir fiyat da bu şekilden aynı sıklıkta devam ederdi. Kapanışta kovalamazsın."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen limit yarıya, stop öbür ucun biraz ötesine; yarım R'lik hedef kapanışın altında kalabilir. Fiyat limit dolmadan devam ederse emri taşımazsın."
dayanak = "1. ders, Şans ne verirdi: yolun aynası; 2. ders, Güçlü ilk mum"

[[kart]]
id = "fiksing-kosu"
hukum = "eksi"
durum = "5 dakikalık grafikte, Londra fiksinginde (WM/R, Londra 16:00; TSİ İngiltere yaz saatinde 18:00, kış saatinde 19:00) fiksinge güçlü koşan bir fiyat"
gorursun = "Fiksingden önceki yarım saatte fiyat tek yöne gitmiş; fiksing dakikası koşunun ucuna yakın."
yaparsin = "Koşunun başını, ucunu ve yarısını işaretlersin; sonraki saatte bir geri çekilme beklersin. Ayın son Londra iş günüyse ayrıca not edersin."
yapmazsin = "Koşunun yönünde yeni işlem açmazsın: sürme payı şansın altında. Geri vermeyi de koşunun tersine piyasa emriyle kenar sanmazsın."
emir = "Başka bir gerekçeyle koşunun tersine gireceksen giriş fiksing anında piyasa emridir, makas ve kayma öder; stop koşunun ucunun ötesinde, hedef yarısında. Stop yakın, maliyet riskin büyük bir parçası."
dayanak = "1. ders, Şans ne verirdi: yolun aynası; 3. ders, Ay sonu; 3. ders, Bu okumaları işleme çevirmek"

[[kart]]
id = "kucuk-mum"
hukum = "eksi"
durum = "15 dakikalık grafikte, Tokyo açılışında (Tokyo 09:00, TSİ 03:00) tipik boyun belirgin altında kalan küçük bir ilk mum"
gorursun = "Dar bir mum; sonraki mumlarda fiyat uçlardan birini kırar."
yaparsin = "İki ucu işaretler, hangisinin önce kırıldığını ve fiyatın bir mum boyu daha gidip gitmediğini izlersin."
yapmazsin = "Kırılımı 'sıkışma patladı' diye işaret saymazsın; dar mumun dar stopunu ucuz sanmazsın."
emir = "Başka bir gerekçeyle kırılımda gireceksen iki uca birer stop emri, biri dolunca öbürü iptal; zarar stopu öbür ucun biraz ötesinde, hedef riskin yarısı kadar."
dayanak = "2. ders, Küçük ilk mum; 2. ders, Bu okumaları işleme çevirmek; 8. ders, Stop uzaklığı ve maliyet"

