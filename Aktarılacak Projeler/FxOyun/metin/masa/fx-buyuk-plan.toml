# ─────────────────────────────────────────── kartlar
[[kart]]
id = "kosu-sonrasi"
durum = "1 saatlik grafikte, önceki 12 mumda mumun yönünde en az iki ATR yürümüş bir piyasada gelen büyük mum"
gorursun = "Gün içinde zaten uzun bir koşu var; büyük mum bu koşunun en uzun mumu ve ucuna yakın kapanıyor. Grafik, sığ bir geri çekilmeden katılmayı çağırıyor gibi görünür."
yaparsin = "Bunun, seçimin 1 saatte bulduğu en iyi girişin durumu olduğunu ve 2024 sonrasında maliyetten önce de eksi kaldığını hatırlarsın. Mumun ucunu ve sığ geri çekilme seviyesini işaretler, durumu bir okuma değil bir uyarı olarak not edersin: bu süzgeç 24 mumluk yolu kendi başına ayırmıyordu."
yapmazsin = "Koşu sürüyor diye sığ geri çekilmeye limit koyup bunu sınanmış bir giriş saymazsın; iki yarıda artı çıkması, görülmemiş dönemde tutacağını göstermedi."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen geri çekilmeye limit, stop girişten iki ATR öteye, hedef bir R. Bir ATR'lik stop seçimin hücresiydi ve aynı makası daha kısa bir mesafeye böler. Limit dolduysa, dolumun fiyatın mumu geri aldığı olaylarda geldiğini bilirsin."
dayanak = "9. ders, Seçilen girişler; 7. ders, 1 saat; 8. ders, Limit neden ucuz görünür: ters seçim"

[[kart]]
id = "bes-dk-kovalama"
durum = "5 dakikalık grafikte, haber saati dışında, ucunda kapanan büyük mum; aklında mumun yönünde bir işlem var"
gorursun = "Gövdesi uzun, kapanışı mumun uç çeyreğinde bir mum; kapanış anında fiyat mumun yönünde ilerlemeyi sürdürüyor ve işlem kaçıyormuş gibi görünüyor."
yaparsin = "Mumun iki ucunu ve yarısını işaretlersin; mumun yönündeki işlemi kapanıştan değil bir geri çekilmeden kurarsın ve emrin dolup dolmadığına göre okumanı güncellersin."
yapmazsin = "Kapanışta piyasa emriyle kovalamazsın; limit dolduğunda okumanın güçlendiğini düşünmezsin; stopu bir ATR'ye çekip pozisyonu büyütmezsin."
emir = "Limit mumun yarısına ya da daha sığ bir geri çekilmeye; stop girişten iki ATR öteye; hedef bir ya da iki R. Limit altı mum içinde dolmazsa emri çekersin: ölçülen emirler de altı mum bekledi. Dolmaması, kaçırdığın işlemin çoğu zaman iyi olanı olduğunu gösterir."
dayanak = "9. ders, Büyük mum için oyun planı (madde 2); 8. ders, Limit neden ucuz görünür: ters seçim; 8. ders, On bir giriş biçimi"

[[kart]]
id = "bes-dk-tersine"
durum = "5 dakikalık grafikte, haber saati dışında, ucunda kapanan büyük mum; mumun tersine girmeyi düşünüyorsun"
gorursun = "Mum uzamış görünüyor; sonraki mumda fiyat ucun biraz gerisine çekiliyor, sonra yeniden uca doğru tırmanıyor."
yaparsin = "Tersine okumanın tek kaynağının hafif geri verme olduğunu bilirsin: o kenar kapanışta tersine girene maliyetten önce kalır, maliyetten sonra kalmaz. Asya seansında ve önünde başka büyük mum varken geri vermenin daha belirgin olduğuna bakarsın."
yapmazsin = "Mumun ucuna tersine limit koyup bunu daha iyi bir fiyat sanmazsın: o limit tam da fiyatın uca geri döndüğü, yani geri vermenin olmadığı olaylarda dolar. Çok uzadı diye uzamayı da satmazsın."
emir = "Başka bir gerekçeyle tersine gireceksen kapanışta piyasa emri limitten fazla maliyet öder ama geri vermeyi yakalar; ikisi de maliyetten sonra eksi. Stop girişten iki ATR öteye, hedef bir R. Fiyat mumun ucunu aşıp orada kalırsa tersine okumanın dayanağı kalmaz; bu çıkış biçimi bu derste ölçülmedi."
dayanak = "9. ders, Büyük mum için oyun planı (madde 3); 8. ders, 5 dakika; 8. ders, Limit neden ucuz görünür: ters seçim; 7. ders, 5 dakika"

[[kart]]
id = "saat-tersine"
durum = "1 saatlik grafikte, Londra ya da örtüşme seansında, günün yeni ucunu yapan uzun bir büyük mum"
gorursun = "Mum önceki saatlerin hepsinden uzun ve fiyat gün içinde çok yol almış; ilk izlenim bu kadar gitti, artık döner."
yaparsin = "1 saatlik büyük mumun bir gün boyunca kendi yönünde hafifçe sürmeye eğilimli olduğunu hatırlarsın; mumun öbür ucunu ve yarısını işaretler, mumun yönüne ters düşen bir işlemi plana yazmazsın."
yapmazsin = "Uzamayı satmazsın, mumun ucuna tersine limit koymazsın; trende karşı büyük mum tuzaktır diye de ters işlem kurmazsın. Mumun yönünde girmek de bir kenar değildir: devam, stoplu ve hedefli bir işlemde maliyetten önce sıfırın ancak biraz üstünde."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen sığ bir geri çekilmeye limit ya da onay mumu; stop iki ATR, hedef bir R. Cuma öğleden sonrasının 1 saatlik mumunda pozisyon hafta sonuna taşar ve bu durum ölçülmedi."
dayanak = "6. ders, Dilim dilim okuma; 7. ders, 1 saat; 8. ders, 15 dakika ve 1 saat; 9. ders, Büyük mum için oyun planı (madde 4)"

[[kart]]
id = "haber-mumu"
durum = "Herhangi bir dilimde ABD istihdam ya da enflasyon verisinin (New York 08:30; TSİ ABD yaz saatinde 15:30, kış saatinde 16:30) ya da Fed, ECB, BoE kararının mumu"
gorursun = "Haberin saatinde başlayan, çevresindeki mumların kat kat üstünde bir mum; grafikte günün en okunaklı yeri gibi görünür."
yaparsin = "Mumu ve iki ucunu işaretler, masadan kalkarsın: bu mumun ardından gelen yolun ortalaması bir yön söyleyemeyecek kadar dağınık. Haberi okuyacaksan içeriğine bakarsın; bu seri haberin içeriğini ölçmedi."
yapmazsin = "Mumun ucuna tersine limit koymazsın: 2018–2023'ün en iyi iki girişi buradan seçildi ve 2024 sonrasında tutmadı. Kovalamazsın da: olay az ve tek bir olay ortalamayı sürükler."
emir = "Başka bir gerekçeyle haber penceresinde emrin varsa stop ve piyasa emirleri olağandan kötü dolar; ölçüm bu pencerede ek kayma varsaydı, gerçek kayma ölçülmedi. Bekleyen limit ve stop emirlerini haber saatinden önce gözden geçirirsin; bunun etkisi bu derste ölçülmedi."
dayanak = "7. ders, Fade mi, devam mı: okuma tablosu; 9. ders, Seçilen girişler; 8. ders, Ölçülmeyenler"

