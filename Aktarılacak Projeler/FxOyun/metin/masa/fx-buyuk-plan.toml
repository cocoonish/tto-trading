# ─────────────────────────────────────────── kartlar
[[kart]]
id = "kosu-sonrasi"
hukum = "eksi"
durum = "1 saatlik grafikte, önceki 12 mumda mumun yönünde en az iki ATR yürümüş bir piyasada gelen büyük mum"
gorursun = "Gün içinde zaten uzun bir koşu var; büyük mum koşunun en uzun mumu ve ucuna yakın kapanıyor. Grafik sığ bir geri çekilmeden katılmayı çağırıyor gibi görünür."
yaparsin = "Bunun seçimin 1 saatte bulduğu en iyi girişin durumu olduğunu ve 2024 sonrasında maliyetten önce de eksi kaldığını hatırlarsın; durumu bir uyarı olarak not edersin."
yapmazsin = "Sığ geri çekilmeye limit koyup bunu sınanmış bir giriş saymazsın; iki yarıda artı çıkması görülmemiş dönemde tutacağını göstermedi."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen geri çekilmeye limit, stop girişten iki ATR öte, hedef bir R. Limit dolduysa dolumun fiyatın mumu geri aldığı olaylarda geldiğini bilirsin."
dayanak = "9. ders, Seçilen girişler; 7. ders, 1 saat; 8. ders, Limit neden ucuz görünür: ters seçim"

[[kart]]
id = "bes-dk-kovalama"
hukum = "eksi"
durum = "5 dakikalık grafikte, haber saati dışında, ucunda kapanan büyük mum; aklında mumun yönünde bir işlem var"
gorursun = "Kapanışı mumun uç çeyreğinde uzun bir mum; kapanış anında fiyat ilerlemeyi sürdürüyor ve işlem kaçıyormuş gibi görünüyor."
yaparsin = "Mumun iki ucunu ve yarısını işaretlersin; mumun yönündeki işlemi kapanıştan değil bir geri çekilmeden kurarsın."
yapmazsin = "Kapanışta piyasa emriyle kovalamazsın; limit dolduğunda okumanın güçlendiğini düşünmezsin; stopu bir ATR'ye çekmezsin."
emir = "Limit mumun yarısına ya da daha sığ bir geri çekilmeye, stop girişten iki ATR öte, hedef bir ya da iki R. Limit altı mum içinde dolmazsa çekersin; ölçülen emirler de altı mum bekledi."
dayanak = "9. ders, Büyük mum için oyun planı (madde 2); 8. ders, Limit neden ucuz görünür: ters seçim; 8. ders, On bir giriş biçimi"

[[kart]]
id = "bes-dk-tersine"
hukum = "eksi"
durum = "5 dakikalık grafikte, haber saati dışında, ucunda kapanan büyük mum; mumun tersine girmeyi düşünüyorsun"
gorursun = "Mum uzamış görünüyor; sonraki mumda fiyat ucun biraz gerisine çekiliyor, sonra yeniden uca doğru tırmanıyor."
yaparsin = "Tersine okumanın tek kaynağının hafif geri verme olduğunu bilirsin: kenar kapanışta tersine girene maliyetten önce kalır, maliyetten sonra kalmaz."
yapmazsin = "Mumun ucuna tersine limiti daha iyi fiyat sanmazsın: o limit fiyatın uca döndüğü, yani geri vermenin olmadığı olaylarda dolar. Uzamayı da satmazsın."
emir = "Başka bir gerekçeyle tersine gireceksen stop girişten iki ATR öte, hedef bir R; piyasa da limit de maliyetten sonra eksi. Fiyat ucu aşıp orada kalırsa okumanın dayanağı kalmaz; bu çıkış biçimi bu derste ölçülmedi."
dayanak = "9. ders, Büyük mum için oyun planı (madde 3); 8. ders, 5 dakika; 7. ders, 5 dakika"

[[kart]]
id = "saat-tersine"
hukum = "eksi"
durum = "1 saatlik grafikte, Londra ya da örtüşme seansında, günün yeni ucunu yapan uzun bir büyük mum"
gorursun = "Mum önceki saatlerin hepsinden uzun; ilk izlenim bu kadar gitti, artık döner."
yaparsin = "1 saatlik büyük mumun bir gün boyunca kendi yönünde hafifçe sürmeye eğilimli olduğunu hatırlarsın ve mumun yönüne ters bir işlemi plana yazmazsın."
yapmazsin = "Uzamayı satmazsın, ucuna tersine limit koymazsın, trende karşı büyük mum tuzaktır diye ters işlem kurmazsın. Mumun yönünde girmek de kenar değildir."
emir = "Başka bir gerekçeyle mumun yönünde gireceksen sığ geri çekilmeye limit ya da onay mumu, stop iki ATR, hedef bir R. Perşembe akşamından sonra açılan mumda pozisyon hafta sonuna taşar ve bu durum ölçülmedi."
dayanak = "6. ders, Dilim dilim okuma; 7. ders, 1 saat; 9. ders, Büyük mum için oyun planı (madde 4)"

[[kart]]
id = "haber-mumu"
hukum = "eksi"
durum = "Herhangi bir dilimde ABD istihdam ya da enflasyon verisinin (New York 08:30; TSİ ABD yaz saatinde 15:30, kış saatinde 16:30) ya da Fed, ECB, BoE kararının mumu"
gorursun = "Haberin saatinde başlayan, çevresindeki mumların kat kat üstünde bir mum; grafikte günün en okunaklı yeri gibi görünür."
yaparsin = "Mumu ve iki ucunu işaretler, masadan kalkarsın: sonraki yolun ortalaması bir yön söyleyemeyecek kadar dağınık. Haberin içeriği bu seride ölçülmedi."
yapmazsin = "Ucuna tersine limit koymazsın; 2018–2023'ün en iyi iki girişi buradan seçildi ve 2024 sonrasında tutmadı. Kovalamazsın da."
emir = "Başka bir gerekçeyle haber penceresinde emrin varsa stop ve piyasa emri olağandan kötü dolar; ölçüm ek kayma varsaydı, gerçek kayma ölçülmedi. Bekleyen emri haberden önce gözden geçirirsin."
dayanak = "7. ders, Fade mi, devam mı: okuma tablosu; 9. ders, Seçilen girişler; 8. ders, Ölçülmeyenler"

