# 9. ders — masa katmanı (büyük mum oyun planı ve 2024 sınaması)

# ─────────────────────────────────────────── karar şeması: büyük mum kapandı, baştan sona
[[karar]]
id = "plan-akis"
baslik = "Büyük mum kapandı: plan baştan sona"
son = "Kalan durumda okuma zayıf, 15 dakikada ayrım yok: başka bir gerekçen yoksa kalk; varsa emri bu dersin emir bölümüyle kur."
[[karar.adim]]
soru = "Dilim 5 dakika, 15 dakika ya da 1 saatin dışında mı?"
cikis = "evet"
sonuc = "Bu seri ölçmedi: planın söyleyeceği yok, kalk"
tur = "kalk"
dayanak = "9. ders, Ölçülmeyenler"
[[karar.adim]]
soru = "Mum takvimdeki büyük bir haberin mumu mu?"
cikis = "evet"
sonuc = "Okuma yok; seçilen haber girişleri de tutmadı: kalk"
tur = "kalk"
dayanak = "7. ders, Fade mi, devam mı: okuma tablosu; 9. ders, Seçilen girişler"
[[karar.adim]]
soru = "Dilim 1 saat mi?"
cikis = "evet"
sonuc = "Tersine girme; yönündeki devam maliyeti karşılamaz"
tur = "yapma"
dayanak = "6. ders, Dilim dilim okuma"
[[karar.adim]]
soru = "Dilim 5 dakika ve kapanış mumun ucuna yakın mı?"
cikis = "evet"
sonuc = "Kovalama; yarıyı bekle, dolumu uyarı say"
tur = "bekle"
dayanak = "7. ders, 5 dakika; 8. ders, Limit neden ucuz görünür: ters seçim"
[[karar.adim]]
soru = "Mum Asya seansında mı, ya da önünde başka büyük mum var mı?"
cikis = "evet"
sonuc = "Geri verme en belirgin; yine de tersine işlem değil"
tur = "yapma"
dayanak = "7. ders, 5 dakika; 8. ders, 5 dakika"

